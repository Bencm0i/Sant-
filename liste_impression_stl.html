<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liste d'impression STL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%2358a6ff' d='M16 3l11 6v14l-11 6-11-6V9z'/%3E%3Cpath fill='%23fff' fill-opacity='.35' d='M16 3l11 6-11 6-11-6z'/%3E%3Cpath fill='%23000' fill-opacity='.25' d='M16 15l11-6v14l-11 6z'/%3E%3C/svg%3E">
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mut:#6b7380;--bd:#dfe3ea;--ac:#2f6fed;--warn:#c2410c;--bad:#b91c1c;--field:#f0f2f6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#171c23;--tx:#e6e9ee;--mut:#8b94a3;--bd:#262d37;--ac:#5b92ff;--warn:#fb923c;--bad:#f87171;--field:#0f1318}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{font-size:18px;margin:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;color:var(--tx);background:var(--field);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}
.plateau{display:flex;align-items:center;gap:4px;color:var(--mut);font-size:13px}
.plateau input{width:56px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--field);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
#base{width:260px}
main{max-width:1200px;margin:0 auto;padding:20px}
#zone{border:2px dashed var(--bd);border-radius:14px;padding:28px;text-align:center;color:var(--mut);cursor:pointer;transition:.15s}
#zone strong{color:var(--tx)}
#zone.drag{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,transparent);color:var(--tx)}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:18px 0 12px}
.bar select{width:auto}
#summary{color:var(--mut)}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:14px}
@media (max-width:600px){#list{grid-template-columns:1fr}}
.card{display:flex;gap:14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.thumb{flex:0 0 150px;height:150px;border-radius:10px;overflow:hidden;background:#dfe3ea;align-self:flex-start}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.top{display:flex;gap:6px}
.top .name{font-weight:600}
.icon{padding:4px 9px}
.meta{color:var(--mut);font-size:12.5px}
.warn{font-size:12.5px;font-weight:600;color:var(--warn)}
.warn:empty{display:none}
.warn.bad{color:var(--bad)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mut)}
.pathbox{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mut)}
.pathrow{display:flex;gap:6px}
textarea{resize:vertical;min-height:52px}
.est{font-size:12.5px;color:var(--mut)}
@media (max-width:420px){.card{flex-direction:column}.thumb{flex-basis:auto;width:100%;height:200px}}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:30px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;z-index:20}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <h1>🧊 Liste d'impression STL</h1>
  <div class="tools">
    <input id="base" placeholder="Dossier par défaut (ex. D:\3D\pieces)" title="Prérempli dans le chemin des nouvelles pièces">
    <span class="plateau">Plateau (mm)
      <input type="number" id="bx" min="1" title="X"><input type="number" id="by" min="1" title="Y"><input type="number" id="bz" min="1" title="Z">
    </span>
    <button id="btnCopy">Copier la liste</button>
    <button id="btnExport">Exporter JSON</button>
    <button id="btnImport">Importer JSON</button>
    <input type="file" id="jsonIn" accept=".json" hidden>
  </div>
</header>
<main>
  <div id="zone"><strong>Glisse tes fichiers .stl ici</strong><br>ou clique pour les choisir (plusieurs possibles)
    <input type="file" id="fileIn" accept=".stl" multiple hidden>
  </div>
  <div class="bar">
    <span id="summary"></span>
    <select id="filter">
      <option value="all">Tous les statuts</option>
      <option value="todo">À imprimer</option>
      <option value="doing">En cours</option>
      <option value="review">À revoir</option>
      <option value="done">Imprimé</option>
    </select>
  </div>
  <div id="list"></div>
</main>
<div id="toast"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const KEY = 'stl-liste-v1';
const MATERIALS = {PLA:1.24, PETG:1.27, ABS:1.04, ASA:1.07, TPU:1.21, PA:1.14, PC:1.20};
const LAYERS = ['0.08','0.12','0.16','0.20','0.24','0.28'];
const SUPPORTS = ['Aucun','Auto','Arbre','Normal'];
const STATUS = {todo:'À imprimer', doing:'En cours', review:'À revoir', done:'Imprimé'};
const THUMB = 192;   // px, vignette JPEG (~5-10 Ko)

/* ---------- état ---------- */
let state = {items:[], bv:[256,256,256], base:''};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.items)) state = Object.assign(state, s); } catch(e){}
state.items.forEach(i=>{ if (typeof i.path !== 'string') i.path = ''; });
// nettoyage de l'ancienne version qui stockait les STL dans IndexedDB
try { indexedDB.deleteDatabase('stl-liste'); } catch(e){}

let filter = 'all';
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ toast('Stockage local plein : exporte en JSON et supprime des entrées.'); }
  }, 250);
}
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),3500); }
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize = b => b>1048576 ? (b/1048576).toFixed(1)+' Mo' : Math.round(b/1024)+' Ko';
function joinPath(base, name){
  if (!base) return '';
  const sep = base.includes('\\') ? '\\' : '/';
  return /[\\/]$/.test(base) ? base+name : base+sep+name;
}

/* ---------- parseur STL (binaire + ASCII) ---------- */
function parseSTL(buf){
  const dv = new DataView(buf);
  let tris, pos;
  const n = dv.byteLength >= 84 ? dv.getUint32(80,true) : 0;
  if (dv.byteLength >= 84 && 84 + n*50 === dv.byteLength){
    tris = n; pos = new Float32Array(n*9);
    let o = 84;
    for (let i=0;i<n;i++){ o+=12; for(let k=0;k<9;k++){ pos[i*9+k]=dv.getFloat32(o,true); o+=4; } o+=2; }
  } else {
    const txt = new TextDecoder().decode(buf);
    const re = /vertex\s+([-+0-9.eE]+)\s+([-+0-9.eE]+)\s+([-+0-9.eE]+)/g;
    const arr = []; let m;
    while ((m = re.exec(txt))) arr.push(+m[1], +m[2], +m[3]);
    tris = Math.floor(arr.length/9);
    pos = new Float32Array(arr.slice(0, tris*9));
  }
  if (!tris) throw new Error('aucun triangle trouvé (fichier STL invalide ?)');
  const nrm = new Float32Array(tris*9);
  const min=[Infinity,Infinity,Infinity], max=[-Infinity,-Infinity,-Infinity];
  let vol = 0;
  for (let i=0;i<tris;i++){
    const b=i*9;
    const ax=pos[b],ay=pos[b+1],az=pos[b+2],bx=pos[b+3],by=pos[b+4],bz=pos[b+5],cx=pos[b+6],cy=pos[b+7],cz=pos[b+8];
    const ux=bx-ax,uy=by-ay,uz=bz-az,vx=cx-ax,vy=cy-ay,vz=cz-az;
    let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
    const l=Math.hypot(nx,ny,nz)||1; nx/=l; ny/=l; nz/=l;
    for (let k=0;k<3;k++){ nrm[b+k*3]=nx; nrm[b+k*3+1]=ny; nrm[b+k*3+2]=nz; }
    for (let k=0;k<3;k++) for (let a=0;a<3;a++){ const v=pos[b+k*3+a]; if(v<min[a])min[a]=v; if(v>max[a])max[a]=v; }
    vol += (ax*(by*cz-bz*cy) - ay*(bx*cz-bz*cx) + az*(bx*cy-by*cx)) / 6;
  }
  return {pos, nrm, tris, min, max, dims:[max[0]-min[0],max[1]-min[1],max[2]-min[2]], volume:Math.abs(vol)};
}

/* ---------- vignette (WebGL hors-écran, une seule fois au dépôt) ---------- */
let gl = null, prog = null, loc = null, cvs = null;
function initGL(){
  cvs = document.createElement('canvas'); cvs.width = cvs.height = THUMB;
  gl = cvs.getContext('webgl',{antialias:true,preserveDrawingBuffer:true});
  if (!gl) throw new Error('WebGL indisponible');
  const vs = `attribute vec3 p;attribute vec3 n;uniform mat3 R;uniform vec3 C;uniform float S;uniform float Z;varying vec3 vn;
    void main(){vec3 q=R*((p-C)*S);vn=R*n;gl_Position=vec4(q.xy*Z,-q.z*0.5,1.0);}`;
  const fs = `precision mediump float;varying vec3 vn;uniform vec3 col;
    void main(){vec3 n=normalize(vn);float d=abs(dot(n,normalize(vec3(0.35,0.55,0.8))));float r=pow(1.0-abs(n.z),3.0)*0.12;gl_FragColor=vec4(col*(0.28+0.72*d)+r,1.0);}`;
  const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o;};
  prog = gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(prog); gl.useProgram(prog);
  loc = {p:gl.getAttribLocation(prog,'p'), n:gl.getAttribLocation(prog,'n'),
    R:gl.getUniformLocation(prog,'R'), C:gl.getUniformLocation(prog,'C'), S:gl.getUniformLocation(prog,'S'),
    Z:gl.getUniformLocation(prog,'Z'), col:gl.getUniformLocation(prog,'col')};
  gl.enable(gl.DEPTH_TEST);
}
function makeThumb(m){
  if (!gl) initGL();
  const bp = gl.createBuffer(), bn = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,bp); gl.bufferData(gl.ARRAY_BUFFER,m.pos,gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER,bn); gl.bufferData(gl.ARRAY_BUFFER,m.nrm,gl.STATIC_DRAW);
  const C = m.min.map((v,i)=>(v+m.max[i])/2), S = 1/(Math.hypot(...m.dims)/2 || 1);
  const a=0.6, b=-Math.PI/2+0.5, ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b);
  gl.viewport(0,0,THUMB,THUMB);
  gl.clearColor(0.875,0.89,0.918,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.uniformMatrix3fv(loc.R,false,[ca,cb*sa,sb*sa, -sa,cb*ca,sb*ca, 0,-sb,cb]);
  gl.uniform3fv(loc.C,C); gl.uniform1f(loc.S,S); gl.uniform1f(loc.Z,0.85);
  gl.uniform3f(loc.col,0.33,0.52,0.92);
  gl.bindBuffer(gl.ARRAY_BUFFER,bp); gl.enableVertexAttribArray(loc.p); gl.vertexAttribPointer(loc.p,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,bn); gl.enableVertexAttribArray(loc.n); gl.vertexAttribPointer(loc.n,3,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.TRIANGLES,0,m.tris*3);
  const url = cvs.toDataURL('image/jpeg',0.72);
  gl.deleteBuffer(bp); gl.deleteBuffer(bn);   // libère la mémoire GPU
  return url;
}

/* ---------- calculs ---------- */
function estGrams(it){
  const d = MATERIALS[it.material] || 1.24;
  const fill = Math.min(1, 0.2 + 0.8*(it.infill/100));   // heuristique : ~20 % de parois
  return it.volume/1000 * d * fill;
}
function fit(it){
  const [x,y,z]=it.dims,[a,b,c]=state.bv;
  if (x<=a && y<=b && z<=c) return 0;
  const s1=[x,y,z].slice().sort((p,q)=>p-q), s2=[a,b,c].slice().sort((p,q)=>p-q);
  return s1.every((v,i)=>v<=s2[i]) ? 1 : 2;
}

/* ---------- rendu de la liste ---------- */
const opts = (list,cur)=>list.map(v=>`<option${String(v)===String(cur)?' selected':''}>${esc(v)}</option>`).join('');
const statusOpts = cur => Object.entries(STATUS).map(([k,v])=>`<option value="${k}"${k===cur?' selected':''}>${v}</option>`).join('');

function cardHTML(it){
  return `<article class="card" data-id="${it.id}">
    <div class="thumb"><img src="${it.thumb}" alt=""></div>
    <div class="body">
      <div class="top"><input class="name" data-k="name" value="${esc(it.name)}"><button class="icon" data-act="del" title="Supprimer">✕</button></div>
      <div class="meta">${it.dims.map(v=>v.toFixed(1)).join(' × ')} mm · ${it.tris.toLocaleString('fr-FR')} triangles · ${(it.volume/1000).toFixed(1)} cm³ · ${fmtSize(it.size)}</div>
      <div class="warn"></div>
      <div class="pathbox">Chemin de la pièce
        <div class="pathrow"><input data-k="path" value="${esc(it.path)}" placeholder="D:\\3D\\pieces\\${esc(it.name)}"><button class="icon" data-act="copy" title="Copier le chemin">Copier</button></div>
      </div>
      <div class="fields">
        <label>Quantité<input type="number" min="1" data-k="qty" value="${it.qty}"></label>
        <label>Matière<select data-k="material">${opts(Object.keys(MATERIALS),it.material)}</select></label>
        <label>Couleur<input data-k="color" value="${esc(it.color)}" placeholder="noir, gris…"></label>
        <label>Couche (mm)<select data-k="layer">${opts(LAYERS,it.layer)}</select></label>
        <label>Remplissage %<input type="number" min="0" max="100" step="5" data-k="infill" value="${it.infill}"></label>
        <label>Supports<select data-k="supports">${opts(SUPPORTS,it.supports)}</select></label>
        <label>Statut<select data-k="status">${statusOpts(it.status)}</select></label>
      </div>
      <label>Commentaires<textarea data-k="note" rows="2" placeholder="Orientation, tolérances, post-traitement…">${esc(it.note)}</textarea></label>
      <div class="est"></div>
    </div>
  </article>`;
}
function refreshCard(card){
  const it = state.items.find(i=>i.id===card.dataset.id); if(!it) return;
  const g = estGrams(it);
  card.querySelector('.est').textContent = `≈ ${g.toFixed(0)} g / pièce · ≈ ${(g*it.qty).toFixed(0)} g pour ×${it.qty} (estimation grossière)`;
  const w = card.querySelector('.warn'), f = fit(it);
  w.className = 'warn' + (f===2?' bad':'');
  w.textContent = f===1 ? '⚠ Ne rentre pas dans cette orientation : à tourner' : f===2 ? '⛔ Trop grand pour le plateau' : '';
}
function refreshSummary(){
  const open = state.items.filter(i=>i.status!=='done');
  const pcs = open.reduce((s,i)=>s+i.qty,0);
  const g = open.reduce((s,i)=>s+estGrams(i)*i.qty,0);
  const kb = Math.round(JSON.stringify(state).length/1024);
  $('#summary').textContent = state.items.length
    ? `${state.items.length} fichier(s) · reste ${pcs} pièce(s) à produire · ≈ ${g.toFixed(0)} g de filament · stockage ≈ ${kb} Ko / ~5000 Ko`
    : '';
}
function render(){
  const items = state.items.filter(i=>filter==='all'||i.status===filter);
  $('#list').innerHTML = items.length ? items.map(cardHTML).join('') : `<div class="empty">${state.items.length?'Aucun fichier avec ce statut.':'Aucun fichier pour l\'instant.'}</div>`;
  document.querySelectorAll('.card').forEach(refreshCard);
  refreshSummary();
}

/* ---------- événements liste ---------- */
$('#list').addEventListener('input', e=>{
  const t = e.target, k = t.dataset.k; if(!k) return;
  const card = t.closest('.card'), it = state.items.find(i=>i.id===card.dataset.id);
  let v = t.value;
  if (k==='qty') v = Math.max(1, parseInt(v)||1);
  if (k==='infill') v = Math.min(100, Math.max(0, parseInt(v)||0));
  it[k] = v; save();
  if (k==='status') { render(); return; }
  refreshCard(card); refreshSummary();
});
$('#list').addEventListener('click', async e=>{
  const act = e.target.closest('[data-act]'); if(!act) return;
  const card = act.closest('.card'), id = card.dataset.id;
  const it = state.items.find(i=>i.id===id);
  if (act.dataset.act==='del'){
    if (!confirm(`Supprimer « ${it.name} » de la liste ?`)) return;
    state.items = state.items.filter(i=>i.id!==id); save(); render();
  } else if (act.dataset.act==='copy'){
    if (!it.path){ toast('Aucun chemin renseigné.'); return; }
    try { await navigator.clipboard.writeText(it.path); toast('Chemin copié.'); } catch(_){ toast('Copie refusée par le navigateur.'); }
  }
});
$('#filter').onchange = e=>{ filter=e.target.value; render(); };

/* ---------- ajout de fichiers ---------- */
async function addFile(f){
  let mesh;
  try { mesh = parseSTL(await f.arrayBuffer()); }
  catch(e){ toast(`${f.name} : ${e.message}`); return; }
  let thumb = '';
  try { thumb = makeThumb(mesh); } catch(e){ toast('Aperçu 3D indisponible (WebGL).'); }
  const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(16).slice(2));
  state.items.unshift({
    id, name:f.name, size:f.size, tris:mesh.tris, dims:mesh.dims, volume:mesh.volume, thumb, added:Date.now(),
    path: joinPath(state.base, f.name),
    qty:1, material:'PLA', color:'', layer:'0.20', infill:15, supports:'Aucun', status:'todo', note:''
  });
  // le maillage n'est pas conservé : seule la vignette + les métadonnées sont stockées
}
async function addFiles(files){
  const list = [...files].filter(f=>/\.stl$/i.test(f.name));
  if (!list.length){ toast('Aucun fichier .stl détecté.'); return; }
  for (const f of list) await addFile(f);
  save(); render();
}
$('#zone').onclick = ()=>$('#fileIn').click();
$('#fileIn').onchange = e=>{ addFiles(e.target.files); e.target.value=''; };
['dragenter','dragover'].forEach(ev=>window.addEventListener(ev,e=>{ e.preventDefault(); $('#zone').classList.add('drag'); }));
window.addEventListener('dragleave',e=>{ if(!e.relatedTarget) $('#zone').classList.remove('drag'); });
window.addEventListener('drop',e=>{ e.preventDefault(); $('#zone').classList.remove('drag'); if(e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

/* ---------- réglages (plateau, dossier par défaut) ---------- */
['bx','by','bz'].forEach((id,i)=>{
  const el = $('#'+id); el.value = state.bv[i];
  el.oninput = ()=>{ state.bv[i] = Math.max(1, +el.value||1); save(); document.querySelectorAll('.card').forEach(refreshCard); };
});
$('#base').value = state.base || '';
$('#base').oninput = e=>{ state.base = e.target.value.trim(); save(); };

/* ---------- export / import / copie ---------- */
$('#btnExport').onclick = ()=>{
  const blob = new Blob([JSON.stringify(state,null,1)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'liste_impression_stl.json'; a.click(); URL.revokeObjectURL(a.href);
};
$('#btnImport').onclick = ()=>$('#jsonIn').click();
$('#jsonIn').onchange = async e=>{
  const f = e.target.files[0]; e.target.value=''; if(!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.items)) throw new Error('format inattendu');
    const ids = new Set(state.items.map(i=>i.id));
    const add = d.items.filter(i=>i.id && !ids.has(i.id)).map(i=>Object.assign({path:''}, i));
    state.items = add.concat(state.items); save(); render();
    toast(`${add.length} fiche(s) importée(s).`);
  } catch(err){ toast('Import impossible : '+err.message); }
};
$('#btnCopy').onclick = async ()=>{
  const items = state.items.filter(i=>i.status!=='done');
  if (!items.length){ toast('Rien à copier.'); return; }
  const txt = items.map(i=>`- ${i.path||i.name} ×${i.qty} · ${i.material}${i.color?' '+i.color:''} · ${i.layer} mm · ${i.infill} % · supports : ${i.supports} [${STATUS[i.status]}]`+(i.note?`\n    ${i.note.replace(/\n/g,'\n    ')}`:'')).join('\n');
  try { await navigator.clipboard.writeText(txt); toast('Liste copiée.'); } catch(_){ toast('Copie refusée par le navigateur.'); }
};

render();
</script>
</body>
</html>
