<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8731a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Bois – Poêle</title>
<link id="fav" rel="icon" type="image/svg+xml" href="">
<style>
:root{--bg:#f6f3ef;--card:#fff;--tx:#1f1b17;--mut:#7a6f64;--line:#e4ddd4;--acc:#e8731a;--acc2:#2a7f62;--grid:#e9e3db;--warn:#c0392b;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#171310;--card:#221c17;--tx:#f1ebe4;--mut:#a79b8f;--line:#38302a;--acc:#ff8a1f;--acc2:#4cc19a;--grid:#322b25;--warn:#ff6b5b;--on:#1a1008}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.top{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.top img{width:44px;height:44px;border-radius:11px}
.top .big{font-size:26px;font-weight:700;line-height:1.1}
.top .big.warn{color:var(--warn)}
.sub{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px}
.pane{display:none}.pane.on{display:block}
label.f{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select,button{font:inherit;color:var(--tx)}
input[type=text],input[type=number],input[type=date],select{width:100%;min-height:48px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px}
button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;cursor:pointer;font-weight:600}
button:active{transform:scale(.97)}
.main{width:100%;min-height:56px;background:var(--acc);border-color:var(--acc);color:var(--on);font-size:18px;margin-top:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button.on,.chips button.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.step{display:grid;grid-template-columns:64px 1fr 64px;gap:8px}
.step button{font-size:28px;font-weight:500;padding:0}
.step input{text-align:center;font-size:28px;font-weight:700;min-height:64px}
.chips{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:6px}
.eq{text-align:center;color:var(--mut);font-size:14px;margin-top:8px;min-height:20px}
details.card summary{cursor:pointer;font-weight:600;min-height:28px}
.tg{display:flex;align-items:center;gap:10px;min-height:48px}
.tg input{width:24px;height:24px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kp .card{margin:0;padding:12px}
.kl{font-size:12.5px;color:var(--mut)}
.kv{font-size:22px;font-weight:700;margin-top:2px}
.ks{font-size:12.5px;color:var(--mut)}
.kv.warn{color:var(--warn)}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.it:last-child{border:0}
.it>div{flex:1;min-width:0}
.it .x{min-height:44px;min-width:44px;padding:0;color:var(--warn)}
.it small{display:block;color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg{width:100%;height:auto;display:block}
.sg label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{border:0;border-radius:0;background:none;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500;color:var(--mut)}
nav button span{font-size:22px;line-height:1}
nav button.on{color:var(--acc);font-weight:700}
#toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:var(--tx);color:var(--bg);border-radius:14px;padding:6px 8px 6px 16px;display:none;align-items:center;justify-content:space-between;gap:10px;z-index:9}
#toast.on{display:flex}
#toast button{background:transparent;border:0;color:var(--acc);min-height:44px}
.empty{color:var(--mut);text-align:center;padding:22px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img id="logo" alt="">
    <div style="flex:1;min-width:0"><div class="kl">Stock restant</div><div class="big" id="t-stock">—</div><div class="sub" id="t-sub"></div></div>
  </div>

  <!-- SAISIE -->
  <section class="pane on" id="p-add">
    <div class="card">
      <h3>🔥 Nouvelle conso</h3>
      <div class="seg" id="units">
        <button data-u="bag">Sacs</button><button data-u="log">Bûches</button><button data-u="kg">kg</button>
      </div>
      <label class="f">Quantité</label>
      <div class="step">
        <button id="qm" aria-label="Moins">−</button>
        <input type="number" id="q" inputmode="decimal" step="any" min="0" value="1">
        <button id="qp" aria-label="Plus">+</button>
      </div>
      <div class="eq" id="eq"></div>
      <label class="f">Date</label>
      <div class="chips" id="chips">
        <button data-d="0">Aujourd’hui</button><button data-d="1">Hier</button><input type="date" id="dd">
      </div>
      <label class="f">Note (facultatif)</label>
      <input type="text" id="note" placeholder="ex. soirée froide">
      <button class="main" id="add">Ajouter la conso</button>
    </div>

    <details class="card">
      <summary>🛒 Nouvel achat</summary>
      <div class="row2">
        <div><label class="f">Sacs</label><input type="number" id="p-bags" inputmode="numeric" min="1" step="1" value="1"></div>
        <div><label class="f">Prix / sac (€)</label><input type="number" id="p-price" inputmode="decimal" step="0.01"></div>
      </div>
      <label class="f">Date</label><input type="date" id="p-date">
      <label class="tg"><input type="checkbox" id="p-disc"><span id="p-disc-l"></span></label>
      <button class="main" id="p-add">Ajouter l’achat</button>
    </details>
  </section>

  <!-- STATS -->
  <section class="pane" id="p-stats">
    <div class="kp" id="kpis"></div>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3 style="margin:0">Conso par jour (kg)</h3>
      <select id="range" style="width:auto;min-height:40px"><option value="14">14 j</option><option value="30" selected>30 j</option><option value="90">90 j</option></select></div>
      <div id="ch1"></div></div>
    <div class="card"><h3>Stock (kg)</h3><div id="ch2"></div></div>
  </section>

  <!-- HISTORIQUE -->
  <section class="pane" id="p-hist">
    <div class="card"><h3>Consommations</h3><div id="h-use"></div></div>
    <div class="card"><h3>Achats</h3><div id="h-pur"></div></div>
  </section>

  <!-- RÉGLAGES -->
  <section class="pane" id="p-set">
    <div class="card sg"><h3>Paramètres</h3><div id="settings"></div></div>
    <div class="card">
      <h3>Données</h3>
      <div class="row2"><button id="exp">Exporter JSON</button><button id="impb">Importer JSON</button></div>
      <input type="file" id="imp" accept=".json,application/json" hidden>
      <button id="clr" style="width:100%;margin-top:8px;color:var(--warn)">Tout effacer</button>
      <p class="sub">Les données restent dans ce navigateur (localStorage) : exporte de temps en temps. Le fichier JSON est compatible avec la version PC.</p>
    </div>
  </section>
</div>

<div id="toast"><span id="toast-t"></span><button id="toast-u">Annuler</button></div>

<nav id="nav">
  <button data-p="p-add" class="on"><span>➕</span>Saisie</button>
  <button data-p="p-stats"><span>📊</span>Stats</button>
  <button data-p="p-hist"><span>🗒️</span>Historique</button>
  <button data-p="p-set"><span>⚙️</span>Réglages</button>
</nav>

<script>
const FAV_SVG=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#2b1d14"/><path d="M32 8c3 9 14 15 14 30a14 14 0 0 1-28 0c0-8 4-12 8-16 0 6 3 8 5 8-2-8-1-14 1-22z" fill="#ff8a1f"/><path d="M32 30c2 5 7 8 7 14a7 7 0 0 1-14 0c0-4 3-6 4-9 1 2 2 3 3 3z" fill="#ffd36b"/></svg>`;
const FAV='data:image/svg+xml,'+encodeURIComponent(FAV_SVG);
$=s=>document.querySelector(s);
$('#fav').href=FAV;$('#logo').src=FAV;

const KEY='poele_bois_v1',UIK='poele_bois_ui';
const DEF={product:'Woodstock densifié Ø 8,5 × 24 cm (XL)',bagPrice:7.99,bagKg:12,logsBag:8,pci:4.6,humid:10,ash:1.5,disc:5,eff:75,infl:3,base:18,djuYear:2400,seasonDays:210,initBags:0,city:'Lyon',lat:45.76,lon:4.84};
const SET=[['bagPrice','Prix du sac','€'],['bagKg','Poids net / sac','kg'],['logsBag','Bûches / sac',''],['pci','PCI','kWh/kg'],['disc','Remise','%'],['eff','Rendement poêle','%'],['infl','Hausse prix an prochain','%'],['seasonDays','Jours de chauffe / an','j'],['initBags','Stock initial','sacs']];

function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j)return{settings:{...DEF,...j.settings},purchases:j.purchases||[],usage:j.usage||[],wx:j.wx||{}}}catch(e){}return{settings:{...DEF},purchases:[],usage:[],wx:{}}}
let S=load();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let UI={unit:'bag',tab:'p-add'};
try{UI={...UI,...JSON.parse(localStorage.getItem(UIK))}}catch(e){}
const saveUI=()=>{try{localStorage.setItem(UIK,JSON.stringify(UI))}catch(e){}};

const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const range=(a,b)=>{const r=[];for(let d=a;d<=b;d=addDays(d,1))r.push(d);return r};
const nf=(v,d=1)=>isFinite(v)?v.toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const eur=(v,d=2)=>isFinite(v)?v.toLocaleString('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const dm=s=>s.slice(8,10)+'/'+s.slice(5,7);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=t=>String(t||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function compute(){
  const s=S.settings,ubd={};S.usage.forEach(u=>ubd[u.date]=(ubd[u.date]||0)+u.kg);
  const dates=Object.keys(ubd).sort();
  const used=S.usage.reduce((a,u)=>a+u.kg,0),bought=S.purchases.reduce((a,p)=>a+p.bags*s.bagKg,0);
  const c={s,ubd,dates,used,bought,stock:s.initBags*s.bagKg+bought-used};
  const t=today();
  if(dates.length){
    c.first=dates[0];c.last=dates[dates.length-1];
    c.perDay=used/(diffDays(c.first,c.last)+1);
    const st=c.first>addDays(t,-13)?c.first:addDays(t,-13);
    let k=0;range(st,t).forEach(d=>k+=ubd[d]||0);
    c.rate=k/Math.max(1,diffDays(st,t)+1);
    c.daysLeft=c.rate>0?c.stock/c.rate:null;
    c.annKg=c.perDay*s.seasonDays;c.annBags=Math.ceil(c.annKg/s.bagKg);
    c.cost=c.annBags*s.bagPrice*(1-s.disc/100);
  }
  c.kwhU=s.bagPrice*(1-s.disc/100)/(s.bagKg*s.pci)/(s.eff/100);
  c.spent=S.purchases.reduce((a,p)=>a+p.bags*p.price*(p.disc?1-s.disc/100:1),0);
  return c;
}

/* ---------- saisie ---------- */
let curDate=today();
const STEP={bag:.25,log:1,kg:.5},QDEF={bag:1,log:1,kg:5};
function kgOf(q,u=UI.unit){const s=S.settings;return u==='bag'?q*s.bagKg:u==='log'?q*s.bagKg/s.logsBag:q}
function renderForm(){
  document.querySelectorAll('#units button').forEach(b=>b.classList.toggle('on',b.dataset.u===UI.unit));
  const q=parseFloat($('#q').value),s=S.settings;
  $('#eq').textContent=q>0?`≈ ${nf(kgOf(q),1)} kg · ${nf(kgOf(q)/s.bagKg,2)} sac · ${nf(kgOf(q)/(s.bagKg/s.logsBag),1)} bûches`:'';
  const t=today(),y=addDays(t,-1);
  document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',curDate===(b.dataset.d==='0'?t:y)));
  $('#dd').value=curDate;$('#dd').style.borderColor=(curDate!==t&&curDate!==y)?'var(--acc)':'';
  $('#p-disc-l').textContent='Remise −'+nf(s.disc,0)+' %';
}
let tt;
function toast(msg,undo){
  $('#toast-t').textContent=msg;$('#toast-u').style.display=undo?'':'none';$('#toast-u').onclick=()=>{undo&&undo();$('#toast').classList.remove('on')};
  $('#toast').classList.add('on');clearTimeout(tt);tt=setTimeout(()=>$('#toast').classList.remove('on'),6000);
}
document.querySelectorAll('#units button').forEach(b=>b.onclick=()=>{UI.unit=b.dataset.u;$('#q').value=QDEF[UI.unit];saveUI();renderForm()});
document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>{curDate=addDays(today(),-parseInt(b.dataset.d));renderForm()});
$('#dd').onchange=e=>{if(e.target.value)curDate=e.target.value;renderForm()};
$('#qm').onclick=()=>{const v=parseFloat($('#q').value)||0;$('#q').value=Math.max(0,Math.round((v-STEP[UI.unit])*100)/100);renderForm()};
$('#qp').onclick=()=>{const v=parseFloat($('#q').value)||0;$('#q').value=Math.round((v+STEP[UI.unit])*100)/100;renderForm()};
$('#q').oninput=renderForm;
$('#add').onclick=()=>{
  const q=parseFloat($('#q').value);if(!(q>0)){toast('Quantité à renseigner');return}
  const kg=kgOf(q),id=uid();
  S.usage.push({id,date:curDate,kg,note:$('#note').value.trim()});
  $('#note').value='';save();render();
  toast(`+${nf(kg,1)} kg le ${dm(curDate)}`,()=>{S.usage=S.usage.filter(u=>u.id!==id);save();render()});
};
$('#p-add').onclick=()=>{
  const b=parseFloat($('#p-bags').value),p=parseFloat($('#p-price').value);
  if(!(b>0)||!(p>=0)){toast('Sacs et prix à renseigner');return}
  const id=uid();S.purchases.push({id,date:$('#p-date').value||today(),bags:b,price:p,disc:$('#p-disc').checked});save();render();
  toast(`Achat de ${nf(b,0)} sac(s) ajouté`,()=>{S.purchases=S.purchases.filter(x=>x.id!==id);save();render()});
};

/* ---------- stats ---------- */
function kp(l,v,sub,cls=''){return `<div class="card"><div class="kl">${l}</div><div class="kv ${cls}">${v}</div><div class="ks">${sub||''}</div></div>`}
function renderKPI(c){
  const s=c.s;
  $('#kpis').innerHTML=[
    kp('Stock',nf(c.stock,0)+' kg',`${nf(c.stock/s.bagKg,1)} sacs`,c.stock<s.bagKg*2?'warn':''),
    kp('Reste ≈',c.daysLeft!=null?nf(c.daysLeft,0)+' j':'—','au rythme des 14 derniers jours'),
    kp('Rythme',c.rate!=null?nf(c.rate,1)+' kg/j':'—',c.perDay!=null?`moyenne ${nf(c.perDay,1)} kg/j`:''),
    kp('Consommé',nf(c.used,0)+' kg',`${nf(c.used/s.bagKg,1)} sacs`),
    kp('Besoin annuel',c.annKg!=null?nf(c.annKg,0)+' kg':'—',c.annBags!=null?`${c.annBags} sacs · ${eur(c.cost,0)} avec remise`:''),
    kp('Dépensé',eur(c.spent,0),'remise déduite'),
    kp('kWh utile',eur(c.kwhU,3),`rendement ${nf(s.eff,0)} %`),
    kp('Énergie',nf(c.used*s.pci,0)+' kWh',`utile ≈ ${nf(c.used*s.pci*s.eff/100,0)} kWh`)
  ].join('');
}
const W=360,H=150,L=32,T=8,B=20;
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v))),m=v/p;return(m<=1?1:m<=2?2:m<=5?5:10)*p}
function axes(mx,ds,n){
  let o='';
  for(let i=0;i<=3;i++){const y=T+(H-T-B)*i/3;o+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${L-4}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--mut)">${nf(mx*(1-i/3),0)}</text>`}
  [0,Math.floor((n-1)/2),n-1].forEach((i,k)=>{o+=`<text x="${L+(i+.5)*(W-L)/n}" y="${H-5}" text-anchor="${k===0?'start':k===2?'end':'middle'}" font-size="10" fill="var(--mut)">${dm(ds[i])}</text>`});
  return o;
}
function chartBars(ds,c){
  const v=ds.map(d=>c.ubd[d]||0),mx=niceMax(Math.max(...v,1)),n=ds.length,bw=(W-L)/n,ih=H-T-B;
  let o=axes(mx,ds,n);
  v.forEach((x,i)=>{if(x>0){const h=x/mx*ih;o+=`<rect x="${L+i*bw+bw*.15}" y="${T+ih-h}" width="${bw*.7}" height="${h}" rx="2" fill="var(--acc)"/>`}});
  return `<svg viewBox="0 0 ${W} ${H}">${o}</svg>`;
}
function chartStock(ds,c){
  const s=c.s,pur={};S.purchases.forEach(p=>pur[p.date]=(pur[p.date]||0)+p.bags*s.bagKg);
  let run=s.initBags*s.bagKg;
  const ev=[...Object.keys(pur),...Object.keys(c.ubd)].sort();
  if(ev.length&&ev[0]<ds[0])range(ev[0],addDays(ds[0],-1)).forEach(d=>run+=(pur[d]||0)-(c.ubd[d]||0));
  const v=ds.map(d=>run+=(pur[d]||0)-(c.ubd[d]||0));
  const n=ds.length,mx=niceMax(Math.max(...v,1)),ih=H-T-B,x=i=>L+(i+.5)*(W-L)/n,y=q=>T+ih-Math.max(0,q)/mx*ih;
  let p='M'+x(0)+' '+y(v[0]);v.forEach((q,i)=>{if(i)p+=`L${x(i)} ${y(v[i-1])}L${x(i)} ${y(q)}`});
  return `<svg viewBox="0 0 ${W} ${H}">${axes(mx,ds,n)}<path d="${p}L${x(n-1)} ${y(0)}L${x(0)} ${y(0)}Z" fill="var(--acc2)" opacity=".2"/><path d="${p}" fill="none" stroke="var(--acc2)" stroke-width="2"/></svg>`;
}
function renderCharts(c){
  const t=today(),r=parseInt($('#range').value),ds=range(addDays(t,-(r-1)),t);
  if(!S.usage.length&&!S.purchases.length){$('#ch1').innerHTML=$('#ch2').innerHTML='<div class="empty">Pas encore de données</div>';return}
  $('#ch1').innerHTML=chartBars(ds,c);$('#ch2').innerHTML=chartStock(ds,c);
}

/* ---------- historique ---------- */
function renderHist(c){
  const s=c.s,us=[...S.usage].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,100);
  $('#h-use').innerHTML=us.length?us.map(u=>`<div class="it"><div><b>${nf(u.kg,1)} kg</b> <span class="sub">· ${nf(u.kg/s.bagKg,2)} sac</span><small>${dm(u.date)}/${u.date.slice(0,4)}${u.note?' · '+esc(u.note):''}</small></div><button class="x" data-du="${u.id}" aria-label="Supprimer">✕</button></div>`).join(''):'<div class="empty">Aucune conso</div>';
  const ps=[...S.purchases].sort((a,b)=>b.date.localeCompare(a.date));
  $('#h-pur').innerHTML=ps.length?ps.map(p=>{const tot=p.bags*p.price*(p.disc?1-s.disc/100:1);return `<div class="it"><div><b>${nf(p.bags,0)} sac(s)</b> <span class="sub">· ${eur(tot)}</span><small>${dm(p.date)}/${p.date.slice(0,4)} · ${eur(p.price)}/sac${p.disc?' · −'+nf(s.disc,0)+' %':''}</small></div><button class="x" data-dp="${p.id}" aria-label="Supprimer">✕</button></div>`}).join(''):'<div class="empty">Aucun achat</div>';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.du&&confirm('Supprimer cette conso ?')){S.usage=S.usage.filter(u=>u.id!==b.dataset.du);save();render()}
  if(b.dataset.dp&&confirm('Supprimer cet achat ?')){S.purchases=S.purchases.filter(p=>p.id!==b.dataset.dp);save();render()}
});

/* ---------- réglages / données ---------- */
function buildSettings(){
  $('#settings').innerHTML=SET.map(([k,l,u])=>`<label>${l}${u?' ('+u+')':''}<input type="number" inputmode="decimal" step="any" data-k="${k}" value="${S.settings[k]}"></label>`).join('');
  $('#settings').querySelectorAll('input').forEach(i=>i.onchange=()=>{const v=parseFloat(i.value);if(!isFinite(v))return;S.settings[i.dataset.k]=v;save();if(i.dataset.k==='bagPrice')$('#p-price').value=v;render()});
}
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='suivi-bois-'+today()+'.json';a.click()};
$('#impb').onclick=()=>$('#imp').click();
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(x=>{try{const j=JSON.parse(x);S={settings:{...DEF,...j.settings},purchases:j.purchases||[],usage:j.usage||[],wx:j.wx||{}};save();buildSettings();$('#p-price').value=S.settings.bagPrice;render();toast('Import réussi')}catch(_){toast('Fichier invalide')}})};
$('#clr').onclick=()=>{if(confirm('Effacer toutes les consos et achats ? (paramètres conservés)')){S.usage=[];S.purchases=[];S.wx={};save();render()}};

/* ---------- navigation ---------- */
function go(p){UI.tab=p;saveUI();document.querySelectorAll('.pane').forEach(e=>e.classList.toggle('on',e.id===p));document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));window.scrollTo(0,0)}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.p));
$('#range').onchange=render;

function render(){
  const c=compute();
  $('#t-stock').textContent=nf(c.stock,0)+' kg';$('#t-stock').classList.toggle('warn',c.stock<c.s.bagKg*2);
  $('#t-sub').textContent=`${nf(c.stock/c.s.bagKg,1)} sacs`+(c.daysLeft!=null?` · ≈ ${nf(c.daysLeft,0)} j restants`:'');
  document.title='Bois – '+nf(c.stock,0)+' kg';
  renderForm();renderKPI(c);renderCharts(c);renderHist(c);
}

$('#p-date').value=today();$('#p-price').value=S.settings.bagPrice;$('#q').value=QDEF[UI.unit];
buildSettings();render();go(document.getElementById(UI.tab)?UI.tab:'p-add');
</script>
</body>
</html>
