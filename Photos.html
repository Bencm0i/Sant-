<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%93%B7</text></svg>">
<title>Photos</title>
<style>
:root{
  --bg:#f4f3f0; --panel:#fff; --text:#1c1a17; --muted:#8a8378;
  --accent:#b5622e; --border:#e6e1d8; --hover:#eeebe4;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#151311; --panel:#1e1b18; --text:#f1ede6; --muted:#a39a8c; --accent:#e08a52; --border:#332e28; --hover:#28241f; }
}
:root[data-theme="dark"]{ --bg:#151311; --panel:#1e1b18; --text:#f1ede6; --muted:#a39a8c; --accent:#e08a52; --border:#332e28; --hover:#28241f; }
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{ background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; display:flex; }
#sidebar{
  width:220px; flex:none; background:var(--panel); border-right:1px solid var(--border);
  padding:16px 12px; padding-top:calc(16px + env(safe-area-inset-top,0px));
  display:flex; flex-direction:column; gap:2px; height:100vh; position:sticky; top:0; overflow-y:auto;
}
#sidebar h1{font-size:1.05rem; margin:0 0 14px 4px}
.nav-item{padding:9px 10px; border-radius:8px; cursor:pointer; font-size:0.9rem; display:flex; align-items:center; gap:8px; user-select:none;}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--accent); color:#fff}
.sec-label{font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:14px 8px 4px}
#albumList{display:flex; flex-direction:column; gap:2px; max-height:30vh; overflow-y:auto}
.album-row .nav-item{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.album-row{display:flex; align-items:center; gap:2px}
.album-del{flex:none; background:none; border:none; color:var(--muted); cursor:pointer; font-size:0.85rem; padding:4px 6px; border-radius:6px;}
.album-del:hover{color:var(--accent); background:var(--hover)}
#newAlbumBtn{margin-top:6px}
#storageInfo{font-size:0.72rem; color:var(--muted); margin-top:auto; padding:8px 6px}
#main{flex:1; min-width:0; display:flex; flex-direction:column; height:100vh; overflow-y:auto}
header{
  position:sticky; top:0; background:var(--bg); z-index:5; padding:16px 22px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));
  border-bottom:1px solid var(--border); display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
header h2{margin:0; font-size:1.1rem; margin-right:auto}
input[type=text], select{padding:8px 11px; border-radius:8px; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:0.87rem;}
button, label.btn{padding:8px 13px; border-radius:8px; border:1px solid var(--border); background:var(--panel); color:var(--text); cursor:pointer; font-size:0.87rem; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;}
button.primary, label.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent)}
input[type=file]{display:none}
#content{padding:20px 22px; flex:1}
.date-group{margin-bottom:26px}
.date-title{font-size:0.85rem; color:var(--muted); margin:0 0 10px 2px; font-weight:600}
.grid{display:grid; gap:6px; grid-template-columns:repeat(auto-fill, minmax(150px,1fr))}
.thumb-wrap{position:relative; aspect-ratio:1; border-radius:8px; overflow:hidden; cursor:pointer; background:var(--panel)}
.thumb-wrap img{width:100%; height:100%; object-fit:cover; display:block}
.fav-badge{position:absolute; top:6px; right:6px; font-size:0.95rem; text-shadow:0 1px 3px #0008; opacity:0; transition:opacity .15s;}
.thumb-wrap:hover .fav-badge, .thumb-wrap .fav-badge.active{opacity:1}
#dropzone{border:2px dashed var(--border); border-radius:14px; padding:60px 20px; text-align:center; color:var(--muted); margin-top:10px;}
#dropzone.drag{border-color:var(--accent); color:var(--accent)}
#empty{text-align:center; color:var(--muted); padding:60px 20px}
#lightbox{position:fixed; inset:0; background:#000e; display:none; z-index:100; flex-direction:column}
#lightbox.open{display:flex}
.lb-top{display:flex; align-items:center; gap:10px; padding:14px 18px; color:#fff}
.lb-top .name-input{flex:1; background:transparent; border:none; color:#fff; font-size:1rem; outline:none}
.lb-top button{background:#ffffff22; color:#fff; border:none}
.lb-body{flex:1; display:flex; align-items:center; justify-content:center; position:relative; min-height:0; overflow:hidden}
.lb-body img{max-width:92%; max-height:88%; object-fit:contain; border-radius:6px; transform-origin:center center; cursor:zoom-in; touch-action:none; user-select:none; -webkit-user-drag:none}
.lb-body img.zoomed{cursor:grab}
.lb-body img.dragging{cursor:grabbing}
.lb-zoom{display:flex; align-items:center; gap:4px}
.lb-zoom .zlbl{min-width:48px; text-align:center; font-size:0.82rem}
.lb-info{font-size:0.78rem; color:#ffffffb0; margin-top:8px; line-height:1.5; word-break:break-all}
.lb-info code{background:#ffffff18; padding:1px 6px; border-radius:5px; color:#fff}
.lb-row .path-input{flex:1; min-width:220px}
.lb-nav{position:absolute; top:50%; transform:translateY(-50%); background:#ffffff22; color:#fff; border:none; width:44px; height:44px; border-radius:50%; font-size:1.3rem; cursor:pointer;}
.lb-nav.prev{left:16px} .lb-nav.next{right:16px}
.lb-bottom{padding:14px 18px 20px; padding-bottom:calc(20px + env(safe-area-inset-bottom,0px)); color:#fff}
.lb-tags{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0}
.lb-tags .tag{background:#ffffff22; padding:3px 9px; border-radius:999px; font-size:0.78rem; cursor:pointer}
.lb-albums{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; font-size:0.8rem}
.lb-albums label{background:#ffffff15; padding:4px 9px; border-radius:8px; display:flex; gap:5px; align-items:center; cursor:pointer}
.lb-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:6px}
.lb-row input[type=text]{background:#ffffff18; border:1px solid #ffffff33; color:#fff; padding:6px 9px; border-radius:7px; font-size:0.82rem}
#count{color:var(--muted); font-size:0.8rem}
#selectionBar{display:none; gap:10px; align-items:center; padding:10px 22px; background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap;}
.select-check{
  position:absolute; top:6px; left:6px; width:20px; height:20px; border-radius:50%;
  border:2px solid #fff; background:#0006; display:none; align-items:center; justify-content:center;
  color:#fff; font-size:0.72rem; font-weight:700;
}
.thumb-wrap.selectable .select-check{display:flex}
.thumb-wrap.selected{outline:3px solid var(--accent); outline-offset:-3px}
.thumb-wrap.selected .select-check{background:var(--accent); border-color:var(--accent)}
#tagCloud{display:flex; flex-wrap:wrap; gap:8px 16px; align-items:baseline; padding:20px 6px; max-width:900px}
.cloud-tag{cursor:pointer; color:var(--accent); border:none; background:none; font-family:inherit; padding:0; line-height:1.3; font-weight:600}
.cloud-tag:hover{text-decoration:underline}
.cloud-empty{color:var(--muted); padding:50px 20px; text-align:center}
.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--border); color:var(--text); padding:10px 16px; border-radius:8px; font-size:0.85rem; z-index:200; box-shadow:0 4px 14px #0003;}

/* ---- Menu radial (touche S, façon SolidWorks) ---- */
#rmOverlay{position:fixed; inset:0; z-index:299; display:none; cursor:default;}
#rmOverlay.open{display:block}
#radialMenu{position:fixed; z-index:300; width:200px; height:200px; margin-left:-100px; margin-top:-100px; display:none; pointer-events:none;}
#radialMenu.open{display:block}
#radialMenu .rm-center{position:absolute; left:50%; top:50%; width:10px; height:10px; margin:-5px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px #0002;}
.rm-item{position:absolute; width:62px; height:62px; margin:-31px; border-radius:50%; background:var(--panel); border:1px solid var(--border); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:1.25rem; line-height:1; cursor:pointer; pointer-events:auto; box-shadow:0 4px 14px #0004; transition:transform .1s ease, background .1s ease;}
.rm-item .rm-label{font-size:0.6rem; color:var(--muted); margin-top:3px}
.rm-item:hover{background:var(--accent); color:#fff; transform:scale(1.1)}
.rm-item:hover .rm-label{color:#fff}
.rm-item.rm-top{left:50%; top:2%}
.rm-item.rm-right{left:98%; top:50%}
.rm-item.rm-bottom{left:50%; top:98%}
.rm-item.rm-left{left:2%; top:50%}
.thumb-wrap.rm-target{outline:3px dashed var(--accent); outline-offset:-3px}
.search-wrap{position:relative; display:inline-flex; align-items:center;}
.search-wrap input{padding-right:26px;}
.search-wrap button{position:absolute; right:3px; background:none; border:none; color:var(--muted); cursor:pointer; font-size:0.78rem; padding:3px 6px; border-radius:50%; line-height:1;}
.search-wrap button:hover{color:var(--accent); background:var(--hover)}
#rmAlbumPop{position:fixed; z-index:301; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:8px; box-shadow:0 6px 20px #0005; display:none; min-width:180px; max-height:240px; overflow-y:auto}
#rmAlbumPop.open{display:block}
#rmAlbumPop .rm-pop-title{font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; padding:2px 6px 6px}
#rmAlbumPop label{display:flex; gap:6px; align-items:center; padding:5px 6px; border-radius:6px; font-size:0.85rem; cursor:pointer}
#rmAlbumPop label:hover{background:var(--hover)}

/* ---- Éditeur rotation / recadrage ---- */
#editor{position:fixed; inset:0; z-index:150; background:#111; display:none; flex-direction:column; color:#fff}
#editor.open{display:flex}
.ed-top{display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top,0px))}
.ed-top button, .ed-top select{background:#ffffff22; color:#fff; border:none}
.ed-top select option{color:#000}
.ed-top button.primary{background:var(--accent)}
.ed-spacer{flex:1}
.ed-stage{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:24px; overflow:hidden}
#edBox{position:relative; flex:none; user-select:none; -webkit-user-select:none}
#edCanvas{display:block}
.ed-clip{position:absolute; inset:0; overflow:hidden; pointer-events:none}
#edFrame{position:absolute; box-shadow:0 0 0 9999px #000a; outline:1px solid #fff;
  background-image:
    linear-gradient(to right, transparent calc(33.333% - .5px), #ffffff55 calc(33.333% - .5px), #ffffff55 calc(33.333% + .5px), transparent calc(33.333% + .5px), transparent calc(66.666% - .5px), #ffffff55 calc(66.666% - .5px), #ffffff55 calc(66.666% + .5px), transparent calc(66.666% + .5px)),
    linear-gradient(to bottom, transparent calc(33.333% - .5px), #ffffff55 calc(33.333% - .5px), #ffffff55 calc(33.333% + .5px), transparent calc(33.333% + .5px), transparent calc(66.666% - .5px), #ffffff55 calc(66.666% - .5px), #ffffff55 calc(66.666% + .5px), transparent calc(66.666% + .5px));}
#edCrop{position:absolute; cursor:move; touch-action:none}
.ed-h{position:absolute; width:30px; height:30px; margin:-15px; touch-action:none}
.ed-h::after{content:''; position:absolute; left:50%; top:50%; width:12px; height:12px; margin:-6px; background:#fff; border:1px solid #0008; border-radius:2px}
.ed-h[data-h=nw]{left:0; top:0; cursor:nwse-resize}
.ed-h[data-h=n]{left:50%; top:0; cursor:ns-resize}
.ed-h[data-h=ne]{left:100%; top:0; cursor:nesw-resize}
.ed-h[data-h=e]{left:100%; top:50%; cursor:ew-resize}
.ed-h[data-h=se]{left:100%; top:100%; cursor:nwse-resize}
.ed-h[data-h=s]{left:50%; top:100%; cursor:ns-resize}
.ed-h[data-h=sw]{left:0; top:100%; cursor:nesw-resize}
.ed-h[data-h=w]{left:0; top:50%; cursor:ew-resize}
.ed-info{padding:10px 16px; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)); font-size:0.8rem; color:#ffffffb0; text-align:center}
</style>
</head>
<body>
<div id="sidebar">
  <h1>📷 Photos</h1>
  <div class="nav-item active" data-view="all">🖼️ Toutes les photos</div>
  <div class="nav-item" data-view="fav">⭐ Favoris</div>
  <div class="nav-item" data-view="tagcloud">🏷️ Nuage de tags</div>
  <div class="sec-label">Albums</div>
  <div id="albumList"></div>
  <button id="newAlbumBtn">+ Nouvel album</button>
  <div class="sec-label">Sauvegarde</div>
  <div class="nav-item" id="exportBtn">⬇️ Exporter config (JSON)</div>
  <label class="nav-item" id="importLabel" style="margin:0">⬆️ Importer
    <input type="file" id="importInput" accept="application/json" style="display:none">
  </label>
  <div class="nav-item" id="clearBtn" style="color:#c0392b">🧹 Vider le cache photos</div>

</div>

<div id="main">
  <header>
    <h2 id="viewTitle">Toutes les photos</h2>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Rechercher...">
      <button id="searchClear" title="Effacer" type="button" style="display:none">✕</button>
    </div>
    <select id="sortSel">
      <option value="date_desc">Plus récentes</option>
      <option value="date_asc">Plus anciennes</option>
      <option value="name">Nom (A-Z)</option>
    </select>
    <label class="btn primary">+ Ajouter
      <input type="file" id="fileInput" accept="image/*" multiple>
    </label>
    <label class="btn" title="Importe un dossier et conserve son chemin relatif">📂 Dossier
      <input type="file" id="folderInput" webkitdirectory multiple>
    </label>
    <button id="selectModeBtn">☑️ Sélectionner</button>
    <span id="count"></span>
  </header>
  <div id="selectionBar">
    <span id="selCount"></span>
    <button id="selAll">Tout sélectionner</button>
    <button id="selNone">Aucune</button>
    <select id="selAlbumSel"><option value="">+ Ajouter à un album...</option></select>
    <button id="selFav">⭐ Favori</button>
    <button id="selDelete">🗑️ Supprimer</button>

  </div>
  <div id="content">
    <div id="dropzone">Glisse des photos ici, ou clique sur « + Ajouter »</div>
    <div id="empty" style="display:none">Aucune photo dans cette vue.</div>
    <div id="groups"></div>
    <div id="tagCloud" style="display:none"></div>
  </div>
</div>

<div id="lightbox">
  <div class="lb-top">
    <button id="lbClose">✕</button>
    <input class="name-input" id="lbName">
    <div class="lb-zoom">
      <button id="lbZoomOut" title="Zoom − (touche -)">➖</button>
      <button id="lbZoomLbl" class="zlbl" title="Réinitialiser (touche 0)">100%</button>
      <button id="lbZoomIn" title="Zoom + (touche +)">➕</button>
    </div>
    <button id="lbEdit" title="Rotation / recadrage (touche E)">✂️</button>
    <button id="lbFav">⭐</button>
    <button id="lbDelete">🗑️</button>
  </div>
  <div class="lb-body">
    <button class="lb-nav prev" id="lbPrev">‹</button>
    <img id="lbImg">
    <button class="lb-nav next" id="lbNext">›</button>
  </div>
  <div class="lb-bottom">
    <div class="lb-row">
      <input type="text" id="lbTagInput" placeholder="+ tag (Entrée)">
      <input type="text" class="path-input" id="lbPath" placeholder="📍 Chemin d'origine (ex : D:\Photos\Vacances)">
    </div>
    <div class="lb-info" id="lbInfo"></div>
    <div class="lb-tags" id="lbTags"></div>
    <div class="lb-albums" id="lbAlbums"></div>
  </div>
</div>

<div id="editor">
  <div class="ed-top">
    <button id="edCancel">✕ Annuler</button>
    <span class="ed-spacer"></span>
    <button id="edRotL" title="Rotation 90° à gauche">↺</button>
    <button id="edRotR" title="Rotation 90° à droite">↻</button>
    <select id="edRatio" title="Proportions du recadrage">
      <option value="0">Libre</option>
      <option value="orig">Original</option>
      <option value="1">1:1</option>
      <option value="1.3333333">4:3</option>

      <option value="1.7777778">16:9</option>
      <option value="0.8">4:5</option>
    </select>
    <button id="edReset" title="Annuler rotation et recadrage en cours">Réinitialiser</button>
    <button id="edRestore" title="Revenir à l'image importée" style="display:none">↩︎ Original</button>

  <div class="ed-stage" id="edStage">
    <div id="edBox">

      <div class="ed-clip"><div id="edFrame"></div></div>
      <div id="edCrop">
        <div class="ed-h" data-h="nw"></div><div class="ed-h" data-h="n"></div><div class="ed-h" data-h="ne"></div>
        <div class="ed-h" data-h="e"></div><div class="ed-h" data-h="se"></div><div class="ed-h" data-h="s"></div>
        <div class="ed-h" data-h="sw"></div><div class="ed-h" data-h="w"></div>
      </div>
    </div>

</div>

<div id="rmOverlay"></div>
<div id="radialMenu">
  <div class="rm-center"></div>
  <div class="rm-item rm-top" data-action="fav" title="Favori (Alt+S)"><span>⭐</span><span class="rm-label">Favori</span></div>
  <div class="rm-item rm-right" data-action="tag" title="Tag (Alt+S)"><span>🏷️</span><span class="rm-label">Tag</span></div>
  <div class="rm-item rm-bottom" data-action="delete" title="Supprimer (Alt+S)"><span>🗑️</span><span class="rm-label">Suppr.</span></div>
  <div class="rm-item rm-left" data-action="album" title="Dossier (Alt+S)"><span>📁</span><span class="rm-label">Dossier</span></div>
</div>
<div id="rmAlbumPop"></div>

<script>
/* ---------- Stockage IndexedDB (Blobs natifs, pas de limite ~5Mo comme localStorage) ---------- */
const DB_NAME='PhotoManagerDB', DB_VERSION=1;
let dbP = new Promise((resolve,reject)=>{
  const req = indexedDB.open(DB_NAME, DB_VERSION);
  req.onupgradeneeded = e=>{
    const d = e.target.result;
    if(!d.objectStoreNames.contains('photos')) d.createObjectStore('photos',{keyPath:'id'});
    if(!d.objectStoreNames.contains('albums')) d.createObjectStore('albums',{keyPath:'id'});
  };
  req.onsuccess = ()=>resolve(req.result);
  req.onerror = ()=>reject(req.error);
});
async function tx(store, mode, fn){
  const d = await dbP;
  return new Promise((resolve,reject)=>{
    const t = d.transaction(store, mode);
    const s = t.objectStore(store);
    const r = fn(s);
    t.oncomplete = ()=>resolve(r && r.result!==undefined ? r.result : undefined);
    t.onerror = ()=>reject(t.error);
  });
}
const savePhoto  = p => tx('photos','readwrite', s=>s.put(p));
const delPhoto   = id => tx('photos','readwrite', s=>s.delete(id));
const allPhotos  = () => tx('photos','readonly', s=>s.getAll());
const saveAlbum  = a => tx('albums','readwrite', s=>s.put(a));
const delAlbumDB = id => tx('albums','readwrite', s=>s.delete(id));
const allAlbums  = () => tx('albums','readonly', s=>s.getAll());

/* ---------- État en mémoire ---------- */
let photos = [];   // {id,name,tags,albums,favorite,addedAt,blob}
let albums = [];   // {id,name}
let view = {mode:'all', albumId:null};
let lbIndex=-1, lbList=[];
const thumbCache = new Map();
const fullCache = new Map();
function thumbUrlOf(p){
  if(!thumbCache.has(p.id)) thumbCache.set(p.id, URL.createObjectURL(p.thumb || p.blob));
  return thumbCache.get(p.id);
}
function fullUrlOf(p){
  if(!fullCache.has(p.id)) fullCache.set(p.id, URL.createObjectURL(p.blob));
  return fullCache.get(p.id);
}
function revokeCaches(id){
  if(thumbCache.has(id)){ URL.revokeObjectURL(thumbCache.get(id)); thumbCache.delete(id); }
  if(fullCache.has(id)){ URL.revokeObjectURL(fullCache.get(id)); fullCache.delete(id); }
}
function makeThumbnail(file, maxSize=440, quality=0.75){
  return new Promise((resolve)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const scale = Math.min(1, maxSize/Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
      const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      canvas.toBlob(b=>{ URL.revokeObjectURL(url); resolve(b || file); }, 'image/jpeg', quality);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

/* ---------- Sauvegarde JSON (export / import) — config uniquement, pas les images ---------- */
async function triggerDownload(filename, blob){
  try{
    if(window.claude && window.claude.use){
      const downloads = await window.claude.use('downloads').catch(()=>null);
      if(downloads){ await downloads.save({filename, data: blob}); return; }
    }
  }catch(e){}
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
async function exportBackup(){
  if(photos.length===0 && albums.length===0){ toast('Rien à exporter pour le moment.'); return; }
  const photosOut = photos.map(p=>({id:p.id, name:p.name, tags:p.tags, albums:p.albums, favorite:p.favorite, addedAt:p.addedAt, path:p.path||''}));
  const payload = {version:2, kind:'config-only', exportedAt:new Date().toISOString(), albums, photos:photosOut};
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const stamp = new Date().toISOString().slice(0,10);
  await triggerDownload(`photos-config-${stamp}.json`, blob);
  toast('Sauvegarde (config) téléchargée.');
}
async function importBackup(file){
  toast('Import en cours...');
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || !Array.isArray(data.photos)) throw new Error('format invalide');
    for(const a of (data.albums||[])){ await saveAlbum(a); }
    let matched = 0, skipped = 0;
    for(const meta of data.photos){
      const p = photos.find(x=>x.id===meta.id);
      if(!p){ skipped++; continue; }
      p.name = meta.name ?? p.name;
      p.tags = meta.tags || p.tags;
      p.albums = meta.albums || p.albums;
      p.favorite = !!meta.favorite;
      if(meta.path!==undefined) p.path = meta.path;
      await savePhoto(p);
      matched++;
    }
    await boot();
    toast(`Config restaurée : ${matched} photo(s) mise(s) à jour${skipped ? `, ${skipped} ignorée(s) (photo absente)` : ''}.`);
  }catch(e){
    toast("Échec de l'import : fichier invalide.");
  }
}

  if(!ok1) return;

function fmtDate(iso){
  const d=new Date(iso), today=new Date(), yest=new Date(Date.now()-86400000);
  const same=(a,b)=>a.toDateString()===b.toDateString();
  if(same(d,today)) return "Aujourd'hui";
  if(same(d,yest)) return "Hier";
  return d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
}

function getFiltered(){

  let list = photos.filter(p=>{
    if(view.mode==='fav' && !p.favorite) return false;
    if(view.mode==='album' && !p.albums.includes(view.albumId)) return false;
    if(q && !(p.name.toLowerCase().includes(q) || p.tags.some(t=>t.toLowerCase().includes(q)) || (p.path||'').toLowerCase().includes(q))) return false;
    return true;
  });
  const sort = document.getElementById('sortSel').value;
  if(sort==='date_asc') list.sort((a,b)=>new Date(a.addedAt)-new Date(b.addedAt));
  else if(sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name));

  return list;
}

function renderTagCloud(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const freq = {};
  photos.forEach(p=>p.tags.forEach(t=>{ freq[t]=(freq[t]||0)+1; }));
  let entries = Object.entries(freq);
  if(q) entries = entries.filter(([t])=>t.toLowerCase().includes(q));
  entries.sort((a,b)=>b[1]-a[1]);
  const el = document.getElementById('tagCloud');
  el.innerHTML = '';
  if(entries.length===0){
    el.innerHTML = '<div class="cloud-empty">Aucun tag trouvé. Ajoute des tags à tes photos depuis la visionneuse.</div>';
    return;
  }
  const counts = entries.map(e=>e[1]);
  const max = Math.max(...counts), min = Math.min(...counts);
  entries.forEach(([t,count])=>{
    const scale = max===min ? 1 : (count-min)/(max-min);
    const btn = document.createElement('button');
    btn.className = 'cloud-tag';
    btn.style.fontSize = (0.85 + scale*1.75).toFixed(2)+'rem';
    btn.style.opacity = (0.55 + scale*0.45).toFixed(2);
    btn.textContent = t;
    btn.title = count+' photo(s)';
    btn.addEventListener('click', ()=>{
      document.getElementById('search').value = t;
      setView('all', null);
    });
    el.appendChild(btn);
  });
}

/* ---------- Zoom (molette+Ctrl, pincement, boutons, double-clic, glisser pour déplacer) ---------- */
let zoom=1, panX=0, panY=0, lbShownId=null;
const ZMIN=1, ZMAX=8;
const lbImgEl = document.getElementById('lbImg');
function applyZoom(){
  lbImgEl.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
  lbImgEl.classList.toggle('zoomed', zoom>1);
  document.getElementById('lbZoomLbl').textContent = Math.round(zoom*100)+'%';
}
function resetZoom(){ zoom=1; panX=0; panY=0; applyZoom(); }
function setZoom(z, cx=0, cy=0){
  z = Math.min(ZMAX, Math.max(ZMIN, z));
  if(z===zoom) return;
  const k = z/zoom;
  panX = cx - (cx-panX)*k; panY = cy - (cy-panY)*k;
  zoom = z;
  if(zoom===1){ panX=0; panY=0; }
  applyZoom();
}
function pointRel(e){
  const r = document.querySelector('.lb-body').getBoundingClientRect();
  return {x:e.clientX-(r.left+r.width/2), y:e.clientY-(r.top+r.height/2)};
}
document.getElementById('lbZoomIn').addEventListener('click', ()=>setZoom(zoom*1.5));
document.getElementById('lbZoomOut').addEventListener('click', ()=>setZoom(zoom/1.5));
document.getElementById('lbZoomLbl').addEventListener('click', resetZoom);
lbImgEl.addEventListener('dblclick', e=>{ const c=pointRel(e); zoom>1 ? resetZoom() : setZoom(2.5, c.x, c.y); });
document.querySelector('.lb-body').addEventListener('wheel', e=>{
  if(!(e.shiftKey||e.ctrlKey||e.metaKey)) return;
  e.preventDefault(); e.stopPropagation();
  const c = pointRel(e);
  const d = e.deltaY || e.deltaX; /* Shift+molette peut arriver en deltaX */
  setZoom(zoom*Math.exp(-d*0.01), c.x, c.y);
}, {passive:false, capture:true});
const ptrs = new Map(); let pinchDist=0;
lbImgEl.addEventListener('pointerdown', e=>{
  lbImgEl.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinchDist=Math.hypot(a.x-b.x,a.y-b.y); }
  if(zoom>1) lbImgEl.classList.add('dragging');
});
lbImgEl.addEventListener('pointermove', e=>{
  const prev = ptrs.get(e.pointerId); if(!prev) return;
  const cur = {x:e.clientX, y:e.clientY};
  if(ptrs.size===2){
    ptrs.set(e.pointerId, cur);
    const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinchDist>0){
      const r=document.querySelector('.lb-body').getBoundingClientRect();
      setZoom(zoom*d/pinchDist, (a.x+b.x)/2-(r.left+r.width/2), (a.y+b.y)/2-(r.top+r.height/2));
    }
    pinchDist=d; return;
  }
  if(zoom>1){ panX += cur.x-prev.x; panY += cur.y-prev.y; applyZoom(); }
  ptrs.set(e.pointerId, cur);
});
['pointerup','pointercancel'].forEach(ev=>lbImgEl.addEventListener(ev, e=>{
  ptrs.delete(e.pointerId); pinchDist=0; lbImgEl.classList.remove('dragging');
}));

(function(){
  const edEl=document.getElementById('editor'), cv=document.getElementById('edCanvas'),
        frame=document.getElementById('edFrame'), crop=document.getElementById('edCrop'),
        box=document.getElementById('edBox'), stage=document.getElementById('edStage'),
        info=document.getElementById('edInfo'), ratioSel=document.getElementById('edRatio'),
        restoreBtn=document.getElementById('edRestore');
  let ed=null, drag=null;
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  const MAXPX=16000000; /* limite canvas (iOS ≈ 16,7 Mpx) */

  function loadBase(){
    let w=ed.img.naturalWidth, h=ed.img.naturalHeight;
    const k=Math.min(1, Math.sqrt(MAXPX/(w*h)));
    if(k<1){ w=Math.floor(w*k); h=Math.floor(h*k); }
    cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(ed.img,0,0,w,h);
    ed.crop={x:0,y:0,w,h}; ed.rotated=0; ed.ratio=0;
    ratioSel.value='0';
  }
  function layout(){
    if(!ed) return;
    ed.s = Math.min((stage.clientWidth-48)/cv.width, (stage.clientHeight-48)/cv.height, 4);
    const dw=cv.width*ed.s, dh=cv.height*ed.s;
    for(const el of [box,cv]){ el.style.width=dw+'px'; el.style.height=dh+'px'; }
    drawCrop();
  }
  function drawCrop(){
    const c=ed.crop, s=ed.s;
    for(const el of [frame,crop]){ el.style.left=c.x*s+'px'; el.style.top=c.y*s+'px'; el.style.width=c.w*s+'px'; el.style.height=c.h*s+'px'; }
    info.textContent = `${Math.round(c.w)} × ${Math.round(c.h)} px` + (ed.rotated ? ` · rotation ${ed.rotated*90}°` : '');
  }

  async function openEditor(){
    const p=lbList[lbIndex]; if(!p||!p.blob) return;
    const url=URL.createObjectURL(p.blob), img=new Image();
    try{ await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=url; }); }
    catch(e){ URL.revokeObjectURL(url); toast('Image illisible.'); return; }
    ed={photo:p, img, url, s:1};
    loadBase();
    restoreBtn.style.display = p.origBlob ? '' : 'none';
    edEl.classList.add('open');
    layout();
  }
  function closeEditor(){
    edEl.classList.remove('open');
    if(ed) URL.revokeObjectURL(ed.url);
    ed=null; drag=null;
  }
  function isDirty(){
    const c=ed.crop;
    return !!ed.rotated || c.x>0.5 || c.y>0.5 || c.w<cv.width-0.5 || c.h<cv.height-0.5;
  }
  function cancel(){
    if(!ed) return;
    if(isDirty() && !confirm('Abandonner les modifications ?')) return;
    closeEditor();
  }

  function rotate(dir){ /* dir: 1 = horaire, -1 = antihoraire */
    const W=cv.width, H=cv.height, t=document.createElement('canvas');
    t.width=H; t.height=W;
    const c=t.getContext('2d');
    if(dir>0){ c.translate(H,0); c.rotate(Math.PI/2); } else { c.translate(0,W); c.rotate(-Math.PI/2); }
    c.drawImage(cv,0,0);
    cv.width=H; cv.height=W;
    cv.getContext('2d').drawImage(t,0,0);
    const r=ed.crop;
    ed.crop = dir>0 ? {x:H-(r.y+r.h), y:r.x, w:r.h, h:r.w} : {x:r.y, y:W-(r.x+r.w), w:r.h, h:r.w};
    if(ed.ratio) ed.ratio=1/ed.ratio;
    ed.rotated=(ed.rotated+dir+4)%4;
    layout();
  }

  function setRatio(v){
    if(v==='0'){ ed.ratio=0; return; }
    const c=ed.crop;
    let r = v==='orig' ? cv.width/cv.height : parseFloat(v);
    /* oriente le ratio (paysage/portrait) comme le cadre actuel, sauf carré */
    if(v!=='orig' && r!==1 && Math.abs(c.w-c.h)>1 && (c.h>c.w)!==(r<1)) r=1/r;
    ed.ratio=r;
    let w=c.w, h=c.h;
    if(w/h>r) w=h*r; else h=w/r;
    ed.crop={x:c.x+(c.w-w)/2, y:c.y+(c.h-h)/2, w, h};
    drawCrop();
  }

  function resizeRect(hd, r0, dx, dy){
    const W=cv.width, H=cv.height;
    const MIN=Math.min(Math.max(16, 28/ed.s), Math.min(W,H)/2);
    const hasW=hd.includes('w'), hasE=hd.includes('e'), hasN=hd.includes('n'), hasS=hd.includes('s');
    let L=r0.x, T=r0.y, R=r0.x+r0.w, B=r0.y+r0.h;
    if(hasW) L=clamp(L+dx,0,R-MIN);
    if(hasE) R=clamp(R+dx,L+MIN,W);
    if(hasN) T=clamp(T+dy,0,B-MIN);
    if(hasS) B=clamp(B+dy,T+MIN,H);
    let w=R-L, h=B-T, out;
    const r=ed.ratio;
    if(!r) return {x:L,y:T,w,h};
    if((hasW||hasE) && (hasN||hasS)){            /* coin : ancre = coin opposé */
      const ax = hasW ? r0.x+r0.w : r0.x, ay = hasN ? r0.y+r0.h : r0.y;
      const maxW = hasW ? ax : W-ax, maxH = hasN ? ay : H-ay;
      if(w/h>r) h=w/r; else w=h*r;
      if(w>maxW){ w=maxW; h=w/r; }
      if(h>maxH){ h=maxH; w=h*r; }
      out={x: hasW ? ax-w : ax, y: hasN ? ay-h : ay, w, h};
    } else if(hasW||hasE){                        /* bord gauche/droit : centré verticalement */
      const cy=r0.y+r0.h/2; h=w/r;
      const maxH=2*Math.min(cy,H-cy);
      if(h>maxH){ h=maxH; w=h*r; }
      out={x: hasW ? r0.x+r0.w-w : r0.x, y:cy-h/2, w, h};
    } else {                                      /* bord haut/bas : centré horizontalement */
      const cx=r0.x+r0.w/2; w=h*r;
      const maxW=2*Math.min(cx,W-cx);
      if(w>maxW){ w=maxW; h=w/r; }
      out={x:cx-w/2, y: hasN ? r0.y+r0.h-h : r0.y, w, h};
    }
    return (out.w<MIN || out.h<MIN) ? r0 : out;
  }

  crop.addEventListener('pointerdown', e=>{
    if(!ed) return;
    drag={h:e.target.dataset.h||'move', sx:e.clientX, sy:e.clientY, r0:{...ed.crop}};
    crop.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  crop.addEventListener('pointermove', e=>{
    if(!drag||!ed) return;
    const dx=(e.clientX-drag.sx)/ed.s, dy=(e.clientY-drag.sy)/ed.s, r0=drag.r0;
    ed.crop = drag.h==='move'
      ? {x:clamp(r0.x+dx,0,cv.width-r0.w), y:clamp(r0.y+dy,0,cv.height-r0.h), w:r0.w, h:r0.h}
      : resizeRect(drag.h, r0, dx, dy);
    drawCrop();
  });
  ['pointerup','pointercancel'].forEach(ev=>crop.addEventListener(ev, ()=>{ drag=null; }));

  async function save(){
    if(!ed) return;
    const p=ed.photo, W=cv.width, H=cv.height, c=ed.crop;
    const x=Math.max(0,Math.round(c.x)), y=Math.max(0,Math.round(c.y));
    const w=Math.min(Math.round(c.w),W-x), h=Math.min(Math.round(c.h),H-y);
    if(!ed.rotated && x===0 && y===0 && w===W && h===H){ toast('Aucune modification.'); closeEditor(); return; }
    const out=document.createElement('canvas'); out.width=w; out.height=h;
    const octx=out.getContext('2d');
    const keep = p.blob.type==='image/png' || p.blob.type==='image/webp';
    const type = keep ? p.blob.type : 'image/jpeg';
    if(!keep){ octx.fillStyle='#fff'; octx.fillRect(0,0,w,h); }
    octx.drawImage(cv,x,y,w,h,0,0,w,h);
    const blob = await new Promise(r=>out.toBlob(r,type,0.92));
    if(!blob){ toast("Échec de l'encodage de l'image."); return; }
    const backup={blob:p.blob, thumb:p.thumb, origBlob:p.origBlob};
    try{
      const thumb = await makeThumbnail(blob);
      if(!p.origBlob) p.origBlob=p.blob;
      p.blob=blob; p.thumb=thumb;
      await savePhoto(p);
    }catch(err){
      Object.assign(p,backup); if(backup.origBlob===undefined) delete p.origBlob;
      toast('Espace insuffisant : modification annulée.'); return;
    }
    revokeCaches(p.id); resetZoom(); closeEditor();
    renderLightbox(); renderGrid(); updateStorageInfo();
    toast('Image modifiée (original conservé).');
  }
  async function restore(){
    if(!ed || !ed.photo.origBlob) return;
    if(!confirm("Restaurer l'image d'origine ? Les modifications enregistrées seront perdues.")) return;
    const p=ed.photo, backup={blob:p.blob, thumb:p.thumb, origBlob:p.origBlob};
    try{
      p.thumb = await makeThumbnail(p.origBlob);
      p.blob = p.origBlob; delete p.origBlob;
      await savePhoto(p);
    }catch(err){ Object.assign(p,backup); toast('Échec de la restauration.'); return; }
    revokeCaches(p.id); resetZoom(); closeEditor();
    renderLightbox(); renderGrid(); updateStorageInfo();
    toast('Original restauré.');
  }

  document.getElementById('lbEdit').addEventListener('click', openEditor);
  document.getElementById('edCancel').addEventListener('click', cancel);
  document.getElementById('edRotL').addEventListener('click', ()=>ed&&rotate(-1));
  document.getElementById('edRotR').addEventListener('click', ()=>ed&&rotate(1));
  ratioSel.addEventListener('change', ()=>ed&&setRatio(ratioSel.value));
  document.getElementById('edReset').addEventListener('click', ()=>{ if(ed){ loadBase(); layout(); } });
  restoreBtn.addEventListener('click', restore);
  document.getElementById('edSave').addEventListener('click', save);
  window.addEventListener('resize', layout);
  document.addEventListener('keydown', e=>{
    if(!ed) return;
    if(e.key==='Escape'){ e.preventDefault(); cancel(); }
  });
  window.openEditor = openEditor;
})();

/* ---------- Menu radial (touche S) + navigation molette ---------- */
let mouseX=0, mouseY=0, hoveredPhotoId=null, rmWheelLock=false;
document.addEventListener('mousemove', e=>{ mouseX=e.clientX; mouseY=e.clientY; });

function isTypingContext(){
  const el = document.activeElement;
  if(!el) return false;
  const tag = el.tagName;
  return tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT' || el.isContentEditable;
}
function currentRmTarget(){
  if(document.getElementById('lightbox').classList.contains('open')){
    const p = lbList[lbIndex];
    return p ? p.id : null;
  }
  return hoveredPhotoId;
}
function highlightHovered(){
  document.querySelectorAll('.thumb-wrap.rm-target').forEach(el=>el.classList.remove('rm-target'));
  if(!hoveredPhotoId) return;
  const el = document.querySelector('.thumb-wrap[data-id="'+hoveredPhotoId+'"]');
  if(el){ el.classList.add('rm-target'); el.scrollIntoView({block:'nearest', behavior:'smooth'}); }
}
function rmNavigate(delta){
  if(document.getElementById('lightbox').classList.contains('open')){
    let ni = Math.max(0, Math.min(lbList.length-1, lbIndex+delta));
    if(ni!==lbIndex){ lbIndex=ni; renderLightbox(); }
    return;
  }
  if(lbList.length===0) return;
  let idx = lbList.findIndex(p=>p.id===hoveredPhotoId);
  if(idx===-1) idx = delta>0 ? -1 : 0;
  const ni = Math.max(0, Math.min(lbList.length-1, idx+delta));
  hoveredPhotoId = lbList[ni].id;
  highlightHovered();
}
function onWheelNav(e){
  const lightboxOpen = document.getElementById('lightbox').classList.contains('open');
  const menuOpen = document.getElementById('radialMenu').classList.contains('open');
  if(!lightboxOpen && !menuOpen) return;
  e.preventDefault();
  if(rmWheelLock) return;
  rmWheelLock = true; setTimeout(()=>rmWheelLock=false, 140);
  rmNavigate(e.deltaY>0 ? 1 : -1);
}
document.getElementById('lightbox').addEventListener('wheel', onWheelNav, {passive:false});
document.getElementById('content').addEventListener('wheel', onWheelNav, {passive:false});

function openRadialMenu(x,y){
  if(!currentRmTarget()) return;
  const menu = document.getElementById('radialMenu');
  menu.style.left = x+'px'; menu.style.top = y+'px';
  menu.classList.add('open');
  document.getElementById('rmOverlay').classList.add('open');
}
function closeRadialMenu(){
  document.getElementById('radialMenu').classList.remove('open');
  document.getElementById('rmOverlay').classList.remove('open');
  document.getElementById('rmAlbumPop').classList.remove('open');
  document.querySelectorAll('.thumb-wrap.rm-target').forEach(el=>el.classList.remove('rm-target'));
}
document.addEventListener('keydown', e=>{
  if(!e.altKey || (e.key!=='s' && e.key!=='S')) return;
  if(document.getElementById('editor').classList.contains('open')) return;
  if(isTypingContext()) return;
  if(document.getElementById('radialMenu').classList.contains('open')) return;
  if(!currentRmTarget()) return;
  e.preventDefault();
  openRadialMenu(mouseX, mouseY);
});
document.getElementById('rmOverlay').addEventListener('click', closeRadialMenu);
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.getElementById('radialMenu').classList.contains('open')) closeRadialMenu();
});

async function rmToggleFav(p){ p.favorite=!p.favorite; await savePhoto(p); renderGrid(); if(document.getElementById('lightbox').classList.contains('open')) renderLightbox(); }
async function rmAddTag(p){
  const val = prompt('Ajouter un tag à « '+p.name+' » :');
  if(val && val.trim()){
    if(!p.tags.includes(val.trim())) p.tags.push(val.trim());
    await savePhoto(p);
    renderGrid(); if(document.getElementById('lightbox').classList.contains('open')) renderLightbox();
  }
}
async function rmDelete(p){
  if(!confirm('Supprimer cette photo ?')) return;
  await delPhoto(p.id);
  photos = photos.filter(x=>x.id!==p.id);
  revokeCaches(p.id);
  if(document.getElementById('lightbox').classList.contains('open')){
    lbList = getFiltered();
    if(lbList.length===0) closeLightbox();
    else { lbIndex = Math.min(lbIndex, lbList.length-1); renderLightbox(); }
  }
  renderGrid(); updateStorageInfo();
}
function rmShowAlbumPicker(p, x, y){
  const pop = document.getElementById('rmAlbumPop');
  pop.innerHTML = '<div class="rm-pop-title">Dossiers</div>';
  if(albums.length===0){
    pop.innerHTML += '<div style="padding:6px; font-size:0.82rem; color:var(--muted)">Aucun album. Crée-en un depuis la barre latérale.</div>';
  }
  albums.forEach(a=>{
    const lab=document.createElement('label');
    lab.innerHTML = `<input type="checkbox" ${p.albums.includes(a.id)?'checked':''}> ${a.name}`;
    lab.querySelector('input').addEventListener('change', async e=>{
      if(e.target.checked){ if(!p.albums.includes(a.id)) p.albums.push(a.id); }
      else p.albums = p.albums.filter(x=>x!==a.id);
      await savePhoto(p); renderGrid();
    });
    pop.appendChild(lab);
  });
  pop.style.left = Math.min(x, window.innerWidth-200)+'px';
  pop.style.top = Math.min(y, window.innerHeight-40)+'px';
  pop.classList.add('open');
}
document.querySelectorAll('.rm-item').forEach(item=>{
  item.addEventListener('click', async e=>{
    e.stopPropagation();
    const id = currentRmTarget();
    const p = photos.find(x=>x.id===id);
    if(!p) { closeRadialMenu(); return; }
    const action = item.dataset.action;
    if(action==='album'){
      const rect = item.getBoundingClientRect();
      rmShowAlbumPicker(p, rect.left, rect.top);
      return;
    }
    closeRadialMenu();
    if(action==='fav') await rmToggleFav(p);
    else if(action==='tag') await rmAddTag(p);
    else if(action==='delete') await rmDelete(p);
  });
});

boot();
</script>
</body>
</html>
