<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Liens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* papier millimétré — bleu moyen, doux mais lisible */
    --bg:#c9dae8;
    --panel:#dbe7f1;
    --panel2:#b7cddf;
    --line:#9ab2c8;
    --text:#1f3347;
    --muted:#5a7186;
    --accent:#2f6690;
    --accent-dim:#a8c4d8;
    --danger:#a3453f;
    --radius:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;padding:0;}
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    font-size:15px;
  }
  /* fine grille "papier millimétré", signature du thème */
  body{
    background-image:
      linear-gradient(rgba(47,102,144,0.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(47,102,144,0.09) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  header{
    position:sticky;top:0;z-index:10;
    background:rgba(201,218,232,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:10px 12px 10px;
  }
  .title-block{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:8px;
  }
  .title-block h1{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin:0;font-weight:500;
  }
  .title-block .count{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);
  }
  #search{
    width:100%;padding:10px 12px;border-radius:var(--radius);
    border:1px solid var(--line);background:var(--panel);
    color:var(--text);font-size:15px;outline:none;
  }
  #search:focus{border-color:var(--accent);}

  #pillBar{
    display:flex;gap:6px;overflow-x:auto;margin-top:8px;
    padding-bottom:2px;scrollbar-width:none;
  }
  #pillBar::-webkit-scrollbar{display:none;}
  .pill{
    flex:none;padding:6px 13px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);font-size:12.5px;
    font-family:'IBM Plex Mono',monospace;letter-spacing:.02em;
    cursor:pointer;white-space:nowrap;user-select:none;
  }
  .pill.active{
    background:var(--accent);border-color:var(--accent);color:#f6f8fa;
  }

  main{padding:12px;max-width:640px;margin:0 auto;padding-bottom:60px;}

  section{margin-bottom:18px;}
  .cat{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;margin-bottom:10px;
  }
  .cat-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 12px;background:var(--panel2);
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--accent);cursor:pointer;
    user-select:none;
  }
  .cat-head .cat-name{
    background:transparent;border:none;color:var(--accent);
    font-family:inherit;font-size:inherit;letter-spacing:inherit;text-transform:inherit;
    outline:none;width:auto;flex:1;
  }
  .cat-head .cat-actions{display:flex;gap:6px;align-items:center;}
  .cat-badge{
    flex:none;min-width:20px;height:18px;padding:0 6px;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent-dim);color:var(--accent);
    border-radius:999px;font-size:10.5px;font-family:'IBM Plex Mono',monospace;
    letter-spacing:0;
  }
  .chev{transition:transform .15s;color:var(--muted);}
  .cat.collapsed .chev{transform:rotate(-90deg);}
  .cat.collapsed .links{display:none;}

  .links{padding:4px;}
  .link-item{
    display:flex;gap:10px;align-items:flex-start;
    padding:8px;border-radius:8px;
  }
  .link-item:active{background:var(--panel2);}
  .favicon{
    width:28px;height:28px;border-radius:6px;flex:none;margin-top:2px;
    background:var(--panel2);object-fit:contain;
  }
  .link-body{flex:1;min-width:0;}
  .link-name{
    font-weight:600;font-size:14.5px;color:var(--text);
    background:transparent;border:none;outline:none;width:100%;padding:0;
    font-family:inherit;
  }
  .link-url{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);
    background:transparent;border:none;outline:none;width:100%;padding:2px 0 0;
    border-bottom:1px dashed transparent;
  }
  .link-url:focus{border-bottom-color:var(--accent-dim);}
  .link-desc{
    font-size:12.5px;color:var(--muted);
    background:transparent;border:none;outline:none;width:100%;resize:none;
    padding:3px 0 0;font-family:inherit;line-height:1.3;
  }
  .link-open{
    flex:none;color:var(--accent);text-decoration:none;font-size:11px;
    font-family:'IBM Plex Mono',monospace;align-self:center;padding:4px 6px;
  }
  .del-btn{
    flex:none;background:none;border:none;color:var(--muted);
    font-size:16px;line-height:1;padding:4px 6px;cursor:pointer;
  }
  .del-btn:hover{color:var(--danger);}
  .add-link-btn, .add-cat-btn, .add-todo-btn{
    width:100%;padding:9px;background:none;border:1px dashed var(--line);
    color:var(--muted);border-radius:8px;font-size:12.5px;
    font-family:'IBM Plex Mono',monospace;cursor:pointer;margin-top:4px;
  }
  .add-cat-btn{border-radius:var(--radius);margin-bottom:18px;}
  .add-link-btn:active, .add-cat-btn:active, .add-todo-btn:active{border-color:var(--accent);color:var(--accent);}

  .panel-title{
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);margin:0 0 8px 2px;
  }
  #notes{
    width:100%;min-height:110px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);color:var(--text);padding:10px 12px;font-size:14px;
    outline:none;resize:vertical;font-family:'IBM Plex Sans',sans-serif;line-height:1.4;
  }
  #notes:focus{border-color:var(--accent);}

  .todo{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;
  }
  .todo-item{
    display:flex;align-items:center;gap:9px;padding:9px 12px;
    border-bottom:1px solid var(--line);
  }
  .todo-item:last-child{border-bottom:none;}
  .todo-item input[type=checkbox]{
    width:17px;height:17px;accent-color:var(--accent);flex:none;
  }
  .todo-text{
    flex:1;background:transparent;border:none;outline:none;color:var(--text);
    font-size:14px;font-family:inherit;
  }
  .todo-item.done .todo-text{color:var(--muted);text-decoration:line-through;}
  .empty-hint{color:var(--muted);font-size:12.5px;padding:10px 12px;font-style:italic;}

  .backup-row{display:flex;gap:8px;}
  .backup-btn{
    flex:1;padding:10px;background:var(--panel);border:1px solid var(--line);
    color:var(--text);border-radius:8px;font-size:12.5px;
    font-family:'IBM Plex Mono',monospace;cursor:pointer;text-align:center;
  }
  .backup-btn:active{border-color:var(--accent);color:var(--accent);}
  .backup-hint{color:var(--muted);font-size:11.5px;margin:6px 2px 0;line-height:1.4;}
</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>Panneau de liens</h1>
    <span class="count" id="linkCount">0 liens</span>
  </div>
  <input id="search" type="text" placeholder="Rechercher un site, une description…" autocomplete="off">
  <div id="pillBar"></div>
</header>

<main>
  <section id="categories"></section>
  <button class="add-cat-btn" id="addCat">+ nouvelle catégorie</button>

  <section>
    <p class="panel-title">Notes</p>
    <textarea id="notes" placeholder="Zone de texte libre…"></textarea>
  </section>

  <section>
    <p class="panel-title">À faire</p>
    <div class="todo" id="todoList"></div>
    <button class="add-todo-btn" id="addTodo">+ ajouter une tâche</button>
  </section>
  <section>
    <p class="panel-title">Sauvegarde</p>
    <div class="backup-row">
      <button class="backup-btn" id="exportBtn">⭳ Exporter JSON</button>
      <button class="backup-btn" id="importBtn">⭱ Importer JSON</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <p class="backup-hint">Tout est stocké uniquement dans ce navigateur. Exporte régulièrement pour transférer vers un autre appareil ou faire une sauvegarde.</p>
  </section>
</main>

<script>
const STORE_KEY = 'liens_dashboard_v1';

const defaultData = {
  categories: [
    {
      id: cid(), name: 'Travail', collapsed:false,
      links: [
        {id:lid(), name:'GitHub', url:'https://github.com', desc:'Dépôts de code, versionnage des outils perso.'},
        {id:lid(), name:'Cults3D', url:'https://cults3d.com', desc:'Vente de modèles et pièces d\u2019impression 3D.'}
      ]
    },
    {
      id: cid(), name: 'Outils perso', collapsed:false,
      links: [
        {id:lid(), name:'bencm0i.github.io', url:'https://bencm0i.github.io', desc:'Hub des outils HTML maison, sans tracking.'}
      ]
    }
  ],
  notes: '',
  todos: []
};

function cid(){ return 'c' + Math.random().toString(36).slice(2,9); }
function lid(){ return 'l' + Math.random().toString(36).slice(2,9); }
function tid(){ return 't' + Math.random().toString(36).slice(2,9); }

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return JSON.parse(JSON.stringify(defaultData));
}
function save(){
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}

let state = load();

function domainOf(url){
  try{
    let u = url.trim();
    if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return new URL(u).hostname;
  }catch(e){ return ''; }
}
function faviconUrl(url){
  const d = domainOf(url);
  return d ? `https://www.google.com/s2/favicons?domain=${d}&sz=64` : '';
}
function normalizeUrl(url){
  let u = url.trim();
  if(!u) return '';
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}

const categoriesEl = document.getElementById('categories');
const searchEl = document.getElementById('search');
const linkCountEl = document.getElementById('linkCount');
const pillBarEl = document.getElementById('pillBar');

let activeFilters = new Set();

function renderPills(){
  pillBarEl.innerHTML = '';
  const allPill = document.createElement('button');
  allPill.className = 'pill' + (activeFilters.size === 0 ? ' active' : '');
  allPill.textContent = 'Tous';
  allPill.addEventListener('click', ()=>{
    activeFilters.clear(); renderPills(); render();
  });
  pillBarEl.appendChild(allPill);

  state.categories.forEach(cat=>{
    const p = document.createElement('button');
    p.className = 'pill' + (activeFilters.has(cat.id) ? ' active' : '');
    p.textContent = cat.name || 'Sans nom';
    p.addEventListener('click', ()=>{
      if(activeFilters.has(cat.id)) activeFilters.delete(cat.id);
      else activeFilters.add(cat.id);
      renderPills(); render();
    });
    pillBarEl.appendChild(p);
  });
}

function render(){
  const q = searchEl.value.trim().toLowerCase();
  categoriesEl.innerHTML = '';
  let total = 0, shown = 0;

  state.categories.forEach(cat=>{
    if(activeFilters.size > 0 && !activeFilters.has(cat.id)) return;

    const filteredLinks = cat.links.filter(l=>{
      total++;
      if(!q) return true;
      return (l.name+' '+l.desc+' '+l.url).toLowerCase().includes(q);
    });
    if(q && filteredLinks.length === 0) return;
    shown += filteredLinks.length;

    const catEl = document.createElement('div');
    catEl.className = 'cat' + (cat.collapsed ? ' collapsed' : '');

    const head = document.createElement('div');
    head.className = 'cat-head';
    head.innerHTML = `
      <svg class="chev" width="12" height="12" viewBox="0 0 12 12" style="margin-right:6px;flex:none"><path d="M3 2l5 4-5 4" stroke="currentColor" fill="none" stroke-width="1.5"/></svg>
      <input class="cat-name" value="${escapeAttr(cat.name)}">
      <div class="cat-actions">
        <span class="cat-badge">${cat.links.length}</span>
        <button class="del-btn" data-action="del-cat" data-cat="${cat.id}" title="Supprimer la catégorie">✕</button>
      </div>
    `;
    head.querySelector('.cat-name').addEventListener('click', e=>e.stopPropagation());
    head.querySelector('.cat-name').addEventListener('change', e=>{
      cat.name = e.target.value; save(); renderPills();
    });
    head.querySelector('[data-action=del-cat]').addEventListener('click', e=>{
      e.stopPropagation();
      if(confirm('Supprimer cette catégorie et ses liens ?')){
        activeFilters.delete(cat.id);
        state.categories = state.categories.filter(c=>c.id!==cat.id);
        save(); renderPills(); render();
      }
    });
    head.addEventListener('click', ()=>{
      cat.collapsed = !cat.collapsed; save(); render();
    });

    const linksWrap = document.createElement('div');
    linksWrap.className = 'links';

    if(filteredLinks.length === 0){
      linksWrap.innerHTML = '<div class="empty-hint">Aucun lien</div>';
    }

    filteredLinks.forEach(link=>{
      const item = document.createElement('div');
      item.className = 'link-item';
      item.innerHTML = `
        <img class="favicon" src="${faviconUrl(link.url)}" onerror="this.style.visibility='hidden'">
        <div class="link-body">
          <input class="link-name" value="${escapeAttr(link.name)}" placeholder="Nom du site">
          <input class="link-url" value="${escapeAttr(link.url)}" placeholder="url.com">
          <textarea class="link-desc" rows="1" placeholder="Petite description…">${escapeHtml(link.desc)}</textarea>
        </div>
        <a class="link-open" href="${normalizeUrl(link.url)}" target="_blank" rel="noopener">OUVRIR</a>
        <button class="del-btn" data-action="del-link" title="Supprimer">✕</button>
      `;
      const nameInput = item.querySelector('.link-name');
      const urlInput = item.querySelector('.link-url');
      const descInput = item.querySelector('.link-desc');
      const openA = item.querySelector('.link-open');
      const favImg = item.querySelector('.favicon');

      autoGrow(descInput);

      nameInput.addEventListener('change', ()=>{ link.name = nameInput.value; save(); });
      urlInput.addEventListener('change', ()=>{
        link.url = urlInput.value; save();
        openA.href = normalizeUrl(link.url);
        favImg.src = faviconUrl(link.url);
        favImg.style.visibility = 'visible';
      });
      descInput.addEventListener('input', ()=>{ link.desc = descInput.value; save(); autoGrow(descInput); });
      item.querySelector('[data-action=del-link]').addEventListener('click', ()=>{
        cat.links = cat.links.filter(l=>l.id!==link.id);
        save(); render();
      });

      linksWrap.appendChild(item);
    });

    const addLinkBtn = document.createElement('button');
    addLinkBtn.className = 'add-link-btn';
    addLinkBtn.textContent = '+ ajouter un lien';
    addLinkBtn.addEventListener('click', ()=>{
      cat.links.push({id:lid(), name:'', url:'', desc:''});
      cat.collapsed = false;
      save(); render();
      const inputs = catEl.querySelectorAll('.link-name');
      if(inputs.length) inputs[inputs.length-1].focus();
    });

    catEl.appendChild(head);
    catEl.appendChild(linksWrap);
    catEl.appendChild(addLinkBtn);
    categoriesEl.appendChild(catEl);
  });

  linkCountEl.textContent = q ? `${shown}/${total} liens` : `${total} liens`;
}

function autoGrow(ta){
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
}
function escapeHtml(s){
  return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function escapeAttr(s){
  return (s||'').replace(/"/g,'&quot;');
}

document.getElementById('addCat').addEventListener('click', ()=>{
  state.categories.push({id:cid(), name:'Nouvelle catégorie', collapsed:false, links:[]});
  save(); renderPills(); render();
});

searchEl.addEventListener('input', render);

// Notes
const notesEl = document.getElementById('notes');
notesEl.value = state.notes || '';
notesEl.addEventListener('input', ()=>{ state.notes = notesEl.value; save(); });

// Todos
const todoListEl = document.getElementById('todoList');
function renderTodos(){
  todoListEl.innerHTML = '';
  if(state.todos.length === 0){
    todoListEl.innerHTML = '<div class="empty-hint">Aucune tâche</div>';
    return;
  }
  state.todos.forEach(t=>{
    const row = document.createElement('div');
    row.className = 'todo-item' + (t.done ? ' done' : '');
    row.innerHTML = `
      <input type="checkbox" ${t.done?'checked':''}>
      <input class="todo-text" value="${escapeAttr(t.text)}" placeholder="Tâche…">
      <button class="del-btn">✕</button>
    `;
    row.querySelector('[type=checkbox]').addEventListener('change', e=>{
      t.done = e.target.checked; save(); renderTodos();
    });
    row.querySelector('.todo-text').addEventListener('change', e=>{
      t.text = e.target.value; save();
    });
    row.querySelector('.del-btn').addEventListener('click', ()=>{
      state.todos = state.todos.filter(x=>x.id!==t.id);
      save(); renderTodos();
    });
    todoListEl.appendChild(row);
  });
}
document.getElementById('addTodo').addEventListener('click', ()=>{
  state.todos.push({id:tid(), text:'', done:false});
  save(); renderTodos();
  const inputs = todoListEl.querySelectorAll('.todo-text');
  if(inputs.length) inputs[inputs.length-1].focus();
});

renderPills();
render();
renderTodos();

// --- Sauvegarde JSON ---
function pad(n){ return String(n).padStart(2,'0'); }

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const stamp = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
  const a = document.createElement('a');
  a.href = url;
  a.download = `liens_${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

const importFileEl = document.getElementById('importFile');
document.getElementById('importBtn').addEventListener('click', ()=> importFileEl.click());

importFileEl.addEventListener('change', ()=>{
  const file = importFileEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try{
      parsed = JSON.parse(reader.result);
      if(!parsed || !Array.isArray(parsed.categories)) throw new Error('format invalide');
    }catch(e){
      alert('Fichier JSON invalide ou format non reconnu.');
      importFileEl.value = '';
      return;
    }

    // ré-attribue des ids neufs pour éviter toute collision
    const importedCats = parsed.categories.map(c => ({
      id: cid(),
      name: c.name || 'Sans nom',
      collapsed: !!c.collapsed,
      links: Array.isArray(c.links) ? c.links.map(l => ({
        id: lid(), name: l.name || '', url: l.url || '', desc: l.desc || ''
      })) : []
    }));
    const importedTodos = Array.isArray(parsed.todos) ? parsed.todos.map(t => ({
      id: tid(), text: t.text || '', done: !!t.done
    })) : [];
    const importedNotes = typeof parsed.notes === 'string' ? parsed.notes : '';

    const doReplace = confirm(
      'OK = remplacer toutes les données actuelles par ce fichier.\n' +
      'Annuler = fusionner avec les données existantes (catégories/liens/tâches ajoutés, rien supprimé).'
    );

    if(doReplace){
      state = { categories: importedCats, notes: importedNotes, todos: importedTodos };
    } else {
      importedCats.forEach(ic=>{
        const existing = state.categories.find(c => c.name.trim().toLowerCase() === ic.name.trim().toLowerCase());
        if(existing){
          ic.links.forEach(il=>{
            const dup = existing.links.some(el => normalizeUrl(el.url).toLowerCase() === normalizeUrl(il.url).toLowerCase() && il.url);
            if(!dup) existing.links.push(il);
          });
        } else {
          state.categories.push(ic);
        }
      });
      importedTodos.forEach(it=>{
        const dup = state.todos.some(et => et.text.trim() === it.text.trim() && it.text.trim() !== '');
        if(!dup) state.todos.push(it);
      });
      if(importedNotes && importedNotes.trim() && !state.notes.includes(importedNotes.trim())){
        state.notes = state.notes ? state.notes + '\n\n' + importedNotes : importedNotes;
      }
    }

    save();
    activeFilters.clear();
    searchEl.value = '';
    notesEl.value = state.notes || '';
    renderPills();
    render();
    renderTodos();
    importFileEl.value = '';
  };
  reader.readAsText(file);
});
</script>
</body>
</html>
