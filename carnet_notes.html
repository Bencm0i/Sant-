<style>
:root{
  --paper:#f7f5f0;
  --paper-dim:#efece4;
  --ink:#2b2620;
  --ink-soft:#5a5245;
  --line:rgba(43,38,32,0.14);
  --accent:#2f5d62;
  --shadow:0 6px 20px rgba(43,38,32,0.10);
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif;
  background:
    linear-gradient(var(--paper),var(--paper)),
    repeating-linear-gradient(transparent,transparent 27px,rgba(43,38,32,0.035) 28px);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* HEADER */
header{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:16px 22px;border-bottom:1.5px solid var(--line);
  background:var(--paper);position:sticky;top:0;z-index:5;
}
h1{
  font-family:'Lora',serif;font-weight:700;font-size:1.35rem;letter-spacing:0.01em;
  display:flex;align-items:center;gap:8px;flex-shrink:0;
}
h1 .spine{width:9px;height:22px;border-radius:2px;background:var(--accent);display:inline-block;}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:420px;}
.search-wrap input{
  width:100%;font-family:'IBM Plex Mono',monospace;font-size:0.85rem;
  padding:9px 14px 9px 34px;border:1.5px solid var(--line);border-radius:999px;
  background:#fff;color:var(--ink);
}
.search-wrap input::placeholder{color:#a39a89;}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:0.45;font-size:0.85rem;pointer-events:none;}
.search-count{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--ink-soft);white-space:nowrap;}
.header-actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;}
.btn{
  font-family:'Inter',sans-serif;font-size:0.74rem;font-weight:600;letter-spacing:0.02em;
  padding:8px 13px;border-radius:8px;border:1.5px solid var(--line);background:#fff;
  color:var(--ink-soft);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow);}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.primary:hover{opacity:0.9;color:#fff;}
input[type=file]{display:none;}

.link-hint{
  font-size:0.72rem; color:var(--ink-soft); padding:6px 16px; border-bottom:1.5px solid var(--line);
  display:flex; align-items:center; gap:4px; flex-wrap:wrap; flex-shrink:0; font-family:'Inter',sans-serif;
}
.link-hint code{
  background:var(--paper-dim); border:1px solid var(--line); border-radius:4px; padding:1px 5px;
  font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--accent);
}

/* LAYOUT */
.layout{flex:1;display:flex;min-height:0;overflow:hidden;}

/* LEFT — TABS */
.tabs-col{
  width:250px;flex-shrink:0;border-right:1.5px solid var(--line);
  display:flex;flex-direction:column;overflow-y:auto;background:var(--paper-dim);
}
.tabs-list{flex:1;overflow-y:auto;padding:10px 0;}
.tab-row{
  display:flex;align-items:stretch;position:relative;cursor:pointer;
  margin:3px 0 3px 0;transition:transform .12s;
}
.tab-row:hover{transform:translateX(2px);}
.tab-spine{width:9px;flex-shrink:0;border-radius:2px 0 0 2px;}
.tab-body{
  flex:1;display:flex;flex-direction:column;padding:9px 10px;
  background:#fff;border:1.5px solid var(--line);border-left:none;border-radius:0 8px 8px 0;
  min-width:0;
}
.tab-row.active .tab-body{background:#fff;border-color:var(--accent);box-shadow:var(--shadow);}
.tab-row.dimmed{opacity:0.32;}
.tab-color-dot{
  width:14px;height:14px;border-radius:50%;flex-shrink:0;cursor:pointer;
  border:1.5px solid rgba(43,38,32,0.2);padding:0;appearance:none;-webkit-appearance:none;
}
.tab-color-dot::-webkit-color-swatch-wrapper{padding:0;}
.tab-color-dot::-webkit-color-swatch{border:none;border-radius:50%;}
.tab-name{
  flex:1;min-width:0;font-family:'Lora',serif;font-weight:600;font-size:0.86rem;
  background:transparent;border:none;outline:none;color:var(--ink);
}
.tab-name::placeholder{color:#b0a695;}
.tab-del{
  background:transparent;border:none;cursor:pointer;opacity:0;font-size:0.85rem;
  color:var(--ink-soft);flex-shrink:0;padding:2px 4px;transition:opacity .12s;
}
.tab-row:hover .tab-del{opacity:0.55;}
.tab-del:hover{opacity:1 !important;color:#a3402f;}
.tab-match-badge{
  font-family:'IBM Plex Mono',monospace;font-size:0.62rem;color:#fff;background:var(--accent);
  border-radius:999px;padding:1px 6px;flex-shrink:0;
}
.tab-main-row{display:flex;align-items:center;gap:8px;min-width:0;}
.tab-snippet{
  font-family:'IBM Plex Mono',monospace;font-size:0.7rem;color:var(--ink-soft);
  padding:3px 0 0 22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tab-snippet mark{background:#f3d98a;color:var(--ink);border-radius:2px;padding:0 1px;font-weight:600;}

/* AI LINKS + TAG BUBBLES */
.ai-link{
  font-family:'IBM Plex Mono',monospace;font-size:0.68rem;font-weight:600;
  padding:5px 9px;border-radius:6px;border:1.5px solid var(--line);background:#fff;
  color:var(--ink-soft);cursor:pointer;transition:all .15s;text-decoration:none;
  display:inline-flex;align-items:center;gap:5px;
}
.ai-link:hover{border-color:var(--accent);color:var(--accent);}
.ai-link .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.ai-link.chatgpt .dot{background:#10a37f;}
.ai-link.claude .dot{background:#c96442;}
.tags-bar{
  display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;
  border-bottom:1.5px solid var(--line);flex-shrink:0;
}
.tag-bubble{
  font-family:'IBM Plex Mono',monospace;font-size:0.72rem;font-weight:600;
  padding:5px 12px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--paper-dim);color:var(--ink-soft);cursor:pointer;transition:all .15s;
}
.tag-bubble:hover{border-color:var(--accent);color:var(--accent);}
.tag-bubble.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.add-tab-wrap{padding:10px 12px 14px;}
.add-tab-btn{
  width:100%;font-family:'IBM Plex Mono',monospace;font-size:0.78rem;font-weight:600;
  padding:9px;border-radius:8px;border:1.5px dashed var(--line);background:transparent;
  color:var(--ink-soft);cursor:pointer;transition:all .15s;
}
.add-tab-btn:hover{border-color:var(--accent);color:var(--accent);border-style:solid;}
.empty-tabs{padding:24px 16px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:0.75rem;color:var(--ink-soft);}

/* TEXT COLUMNS */
.text-col{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1.5px solid var(--line);}
.text-col:last-child{border-right:none;}
.col-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 16px;border-bottom:1.5px solid var(--line);flex-shrink:0;
}
.col-label{font-family:'Lora',serif;font-weight:600;font-size:0.86rem;color:var(--ink);display:flex;align-items:center;gap:8px;}
.col-label .active-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.col-tools{display:flex;gap:6px;}
.col-tools button{
  font-family:'IBM Plex Mono',monospace;font-size:0.68rem;font-weight:600;
  padding:5px 9px;border-radius:6px;border:1.5px solid var(--line);background:#fff;
  color:var(--ink-soft);cursor:pointer;transition:all .15s;
}
.col-tools button:hover{border-color:var(--accent);color:var(--accent);}
textarea.note-area{
  flex:1;width:100%;border:none;outline:none;resize:none;
  font-family:'IBM Plex Mono',monospace;font-size:0.86rem;line-height:1.65;
  padding:18px 20px;color:var(--ink);background:transparent;
}
textarea.note-area::placeholder{color:#b0a695;}
.char-count{
  padding:6px 16px;font-family:'IBM Plex Mono',monospace;font-size:0.65rem;
  color:var(--ink-soft);border-top:1.5px solid var(--line);flex-shrink:0;
}
mark{background:#f3d98a;color:var(--ink);border-radius:2px;}

.no-selection{
  flex:1;display:flex;align-items:center;justify-content:center;
  font-family:'Lora',serif;font-style:italic;color:var(--ink-soft);font-size:0.95rem;padding:20px;text-align:center;
}

@media(max-width:820px){
  .layout{flex-direction:column;overflow-y:auto;}
  .tabs-col{width:100%;max-height:220px;border-right:none;border-bottom:1.5px solid var(--line);}
  .text-col{border-right:none;border-bottom:1.5px solid var(--line);min-height:280px;}
}
</style>
</head>
<body>

<header>
  <h1><span class="spine"></span>Carnet</h1>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="searchInput" placeholder="Rechercher dans tous les onglets…" oninput="onSearch()">
  </div>
  <span class="search-count" id="searchCount"></span>
  <div class="header-actions">
    <button class="btn" onclick="document.getElementById('importInput').click()">⬆ Importer JSON</button>
    <input type="file" id="importInput" accept=".json" onchange="importJSON(event)">
    <button class="btn primary" onclick="exportJSON()">⬇ Exporter JSON</button>
  </div>
</header>

<div class="link-hint">🔗 Écris <code>[[Nom de l'onglet]]</code> puis <strong>Ctrl+clic</strong> (⌘+clic sur Mac) dessus pour y accéder</div>

<div class="layout">
  <div class="tabs-col">
    <div class="tabs-list" id="tabsList"></div>
    <div class="add-tab-wrap">
      <button class="add-tab-btn" onclick="addTab()">＋ Nouvel onglet</button>
    </div>
  </div>

  <div class="text-col" id="rawCol">
    <div class="col-head">
      <span class="col-label"><span class="active-dot" id="rawDot"></span><span id="rawLabel">Texte brut</span></span>
      <div class="col-tools">
        <button onclick="insertTimestamp()" title="Insérer la date et l'heure actuelles dans le texte brut">🕒 Horodatage</button>
        <button onclick="copyRawToClipboard()" title="Copier le texte brut dans le presse-papiers">📋 Copier</button>
        <button onclick="copyRawToIA()" title="Copier vers la colonne IA">→ IA</button>
        <button class="ai-link chatgpt" onclick="sendToAI('chatgpt')" title="Copier le texte (+ tag choisi) et ouvrir ChatGPT"><span class="dot"></span>ChatGPT ↗</button>
        <button class="ai-link claude" onclick="sendToAI('claude')" title="Copier le texte (+ tag choisi) et ouvrir Claude"><span class="dot"></span>Claude ↗</button>
      </div>
    </div>
    <div class="tags-bar" id="tagsBar"></div>
    <textarea class="note-area" id="rawArea" placeholder="Écris ton texte brut ici…" oninput="onEdit('raw')"></textarea>
    <div class="char-count" id="rawCount">0 caractère</div>
  </div>

  <div class="text-col" id="iaCol">
    <div class="col-head">
      <span class="col-label"><span class="active-dot" id="iaDot"></span>Retravaillé (IA)</span>
      <div class="col-tools">
        <button onclick="copyIAToClipboard()" title="Copier le texte IA dans le presse-papiers">📋 Copier</button>
        <button onclick="copyIAToRaw()" title="Copier vers la colonne texte brut">← Brut</button>
      </div>
    </div>
    <textarea class="note-area" id="iaArea" placeholder="Colle ici le texte retravaillé par une IA…" oninput="onEdit('ia')"></textarea>
    <div class="char-count" id="iaCount">0 caractère</div>
  </div>
</div>

<script>
const STORAGE_KEY = 'carnet_notes_data';
const PALETTE = ['#2f5d62','#b5573f','#c98a2c','#6b4a6b','#5c6b3f','#45566b','#7a3b46','#3d5a73'];

let state = { order: [], tabs: {} };
let activeId = null;
let saveTimer = null;
let selectedTagKey = null;

const TAGS = [
  { key:'traduis-eng-fr', label:'#traduis-eng-fr', prompt:'Traduis ce texte de l\'anglais vers le français :' },
  { key:'traduis-fr-eng', label:'#traduis-fr-eng', prompt:'Traduis ce texte du français vers l\'anglais :' },
  { key:'corrige',        label:'#corrige',        prompt:'Corrige l\'orthographe et la grammaire de ce texte, sans en changer le sens :' },
  { key:'reformule',      label:'#reformule',      prompt:'Reformule ce texte pour qu\'il soit plus clair et plus fluide :' },
  { key:'resume',         label:'#resume',         prompt:'Résume ce texte de façon concise :' },
  { key:'analyse-pro',    label:'#analyse-pro',    prompt:'Analyse ce texte de façon professionnelle et structurée :' }
];

function uid(){ return 't_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function load(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{
      const data = JSON.parse(raw);
      if(data && data.tabs && data.order){ state = data; return; }
    }catch(e){}
  }
  // Premier lancement : un onglet d'exemple
  const id = uid();
  state = { order:[id], tabs:{ [id]: { name:'Notes', color:PALETTE[0], raw:'', ia:'' } } };
}

function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }, 250);
}

function addTab(){
  const id = uid();
  const color = PALETTE[state.order.length % PALETTE.length];
  state.tabs[id] = { name:'Nouvel onglet', color, raw:'', ia:'' };
  state.order.push(id);
  activeId = id;
  persist();
  renderTabs();
  renderColumns();
  setTimeout(()=>{
    const input = document.querySelector('.tab-row.active .tab-name');
    if(input){ input.focus(); input.select(); }
  }, 30);
}

function deleteTab(id){
  const t = state.tabs[id];
  if(!confirm('Supprimer l\'onglet "'+(t?.name||'')+'" et son contenu ?')) return;
  state.order = state.order.filter(x=>x!==id);
  delete state.tabs[id];
  if(activeId === id) activeId = state.order[0] || null;
  persist();
  renderTabs();
  renderColumns();
}

function selectTab(id){
  if(activeId === id) return;
  activeId = id;
  updateActiveRow();
  renderColumns();
}

function updateActiveRow(){
  document.querySelectorAll('#tabsList .tab-row').forEach(row=>row.classList.remove('active'));
  const idx = state.order.indexOf(activeId);
  if(idx > -1){
    const rows = document.querySelectorAll('#tabsList .tab-row');
    if(rows[idx]) rows[idx].classList.add('active');
  }
}

function renameTab(id, val){
  state.tabs[id].name = val;
  persist();
}

function recolorTab(id, val){
  state.tabs[id].color = val;
  persist();
  renderTabs();
}

function renderTabs(){
  const list = document.getElementById('tabsList');
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  list.innerHTML = '';
  if(state.order.length === 0){
    list.innerHTML = '<div class="empty-tabs">Aucun onglet.<br>Crée-en un pour commencer.</div>';
    return;
  }
  let visibleCount = 0;
  state.order.forEach(id=>{
    const t = state.tabs[id];
    const hay = (t.name+' '+t.raw+' '+t.ia).toLowerCase();
    const matches = q && hay.includes(q);
    const dim = q && !matches;
    if(matches) visibleCount++;

    const row = document.createElement('div');
    row.className = 'tab-row' + (id===activeId ? ' active' : '') + (dim ? ' dimmed' : '');

    const spine = document.createElement('div');
    spine.className = 'tab-spine';
    spine.style.background = t.color;
    row.appendChild(spine);

    const body = document.createElement('div');
    body.className = 'tab-body';
    body.onclick = (e)=>{ if(e.target.tagName!=='INPUT') selectTab(id); };

    const mainRow = document.createElement('div');
    mainRow.className = 'tab-main-row';

    const dot = document.createElement('input');
    dot.type = 'color';
    dot.className = 'tab-color-dot';
    dot.value = t.color;
    dot.title = 'Couleur de l\'onglet';
    dot.oninput = (e)=> recolorTab(id, e.target.value);
    mainRow.appendChild(dot);

    const name = document.createElement('input');
    name.className = 'tab-name';
    name.value = t.name;
    name.placeholder = 'Nom de l\'onglet';
    name.oninput = (e)=> renameTab(id, e.target.value);
    name.onclick = ()=> selectTab(id);
    name.onfocus = ()=>{ if(activeId!==id) selectTab(id); };
    mainRow.appendChild(name);

    if(q && matches){
      const badge = document.createElement('span');
      badge.className = 'tab-match-badge';
      badge.textContent = '●';
      mainRow.appendChild(badge);
    }

    const del = document.createElement('button');
    del.className = 'tab-del';
    del.textContent = '✕';
    del.title = 'Supprimer';
    del.onclick = (e)=>{ e.stopPropagation(); deleteTab(id); };
    mainRow.appendChild(del);

    body.appendChild(mainRow);

    if(q && matches){
      const snippetEl = buildSnippetEl(t, q);
      if(snippetEl) body.appendChild(snippetEl);
    }

    row.appendChild(body);
    list.appendChild(row);
  });

  const countEl = document.getElementById('searchCount');
  countEl.textContent = q ? (visibleCount + ' résultat' + (visibleCount!==1?'s':'')) : '';
}

function findContext(text, q, wordsAround){
  if(!text) return null;
  const lower = text.toLowerCase();
  const idx = lower.indexOf(q);
  if(idx === -1) return null;

  const before = text.slice(0, idx);
  const match = text.slice(idx, idx + q.length);
  const after = text.slice(idx + q.length);

  const beforeWords = before.split(/\s+/).filter(Boolean);
  const afterWords = after.split(/\s+/).filter(Boolean);

  const beforeSlice = beforeWords.slice(-wordsAround);
  const afterSlice = afterWords.slice(0, wordsAround);

  return {
    before: (beforeWords.length > wordsAround ? '… ' : '') + beforeSlice.join(' '),
    match,
    after: afterSlice.join(' ') + (afterWords.length > wordsAround ? ' …' : '')
  };
}

function buildSnippetEl(t, q){
  // Priorité : texte brut, puis texte IA, puis nom de l'onglet
  const ctx = findContext(t.raw, q, 5) || findContext(t.ia, q, 5) || findContext(t.name, q, 5);
  if(!ctx) return null;

  const el = document.createElement('div');
  el.className = 'tab-snippet';

  if(ctx.before) el.appendChild(document.createTextNode(ctx.before + ' '));
  const mark = document.createElement('mark');
  mark.textContent = ctx.match;
  el.appendChild(mark);
  if(ctx.after) el.appendChild(document.createTextNode(' ' + ctx.after));

  el.title = (ctx.before + ' ' + ctx.match + ' ' + ctx.after).trim();
  return el;
}

function renderColumns(){
  const rawArea = document.getElementById('rawArea');
  const iaArea = document.getElementById('iaArea');
  const rawDot = document.getElementById('rawDot');
  const iaDot = document.getElementById('iaDot');

  const t = state.tabs[activeId];
  if(!t){
    rawArea.value = ''; iaArea.value = '';
    rawArea.disabled = true; iaArea.disabled = true;
    rawDot.style.background = 'transparent';
    iaDot.style.background = 'transparent';
    document.getElementById('rawCount').textContent = '0 caractère';
    document.getElementById('iaCount').textContent = '0 caractère';
    return;
  }
  rawArea.disabled = false; iaArea.disabled = false;
  rawArea.value = t.raw;
  iaArea.value = t.ia;
  rawDot.style.background = t.color;
  iaDot.style.background = t.color;
  updateCounts();
}

function updateCounts(){
  const rawArea = document.getElementById('rawArea');
  const iaArea = document.getElementById('iaArea');
  document.getElementById('rawCount').textContent = rawArea.value.length + ' caractère' + (rawArea.value.length!==1?'s':'');
  document.getElementById('iaCount').textContent = iaArea.value.length + ' caractère' + (iaArea.value.length!==1?'s':'');
}

function onEdit(which){
  if(!activeId) return;
  const t = state.tabs[activeId];
  if(which==='raw') t.raw = document.getElementById('rawArea').value;
  else t.ia = document.getElementById('iaArea').value;
  updateCounts();
  persist();
}

function onSearch(){
  renderTabs();
}

function renderTagsBar(){
  const bar = document.getElementById('tagsBar');
  bar.innerHTML = '';
  TAGS.forEach(tag=>{
    const b = document.createElement('button');
    b.className = 'tag-bubble' + (selectedTagKey===tag.key ? ' active' : '');
    b.textContent = tag.label;
    b.title = tag.prompt;
    b.onclick = ()=> toggleTag(tag.key);
    bar.appendChild(b);
  });
}

function toggleTag(key){
  const tag = TAGS.find(t=>t.key===key);
  const wasSelected = selectedTagKey === key;
  selectedTagKey = wasSelected ? null : key;
  renderTagsBar();
  if(!wasSelected && tag){
    insertTagText(tag.label);
  }
}

function insertTagText(label){
  if(!activeId){ alert('Sélectionne ou crée un onglet d\'abord.'); return; }
  const area = document.getElementById('rawArea');
  const start = area.selectionStart ?? area.value.length;
  const end = area.selectionEnd ?? area.value.length;
  const before = area.value.slice(0, start);
  const after = area.value.slice(end);
  const needsSpaceBefore = before.length && !/\s$/.test(before);
  const needsSpaceAfter = after.length && !/^\s/.test(after);
  const insertion = (needsSpaceBefore ? ' ' : '') + label + (needsSpaceAfter ? ' ' : '');

  area.value = before + insertion + after;
  const caret = before.length + insertion.length;
  area.focus();
  area.setSelectionRange(caret, caret);

  onEdit('raw');
  flash('rawCol');
}

function sendToAI(target){
  const raw = document.getElementById('rawArea').value;
  if(!raw.trim()){ alert('Le texte brut est vide.'); return; }
  const tag = TAGS.find(t=>t.key===selectedTagKey);
  const payload = tag ? (tag.prompt + '\n\n' + raw) : raw;

  const url = target === 'chatgpt' ? 'https://chatgpt.com/' : 'https://claude.ai/new';

  const openAndNotify = ()=>{
    window.open(url, '_blank', 'noopener');
    flash('rawCol');
  };

  copyTextToClipboard(payload).then(openAndNotify).catch(openAndNotify);
}

function insertTimestamp(){
  if(!activeId) return;
  const area = document.getElementById('rawArea');
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const stamp = '[' + pad(now.getDate()) + '/' + pad(now.getMonth()+1) + '/' + now.getFullYear()
    + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ']';

  const start = area.selectionStart ?? area.value.length;
  const end = area.selectionEnd ?? area.value.length;
  const before = area.value.slice(0, start);
  const after = area.value.slice(end);
  // On ajoute un espace de séparation si nécessaire pour ne pas coller au texte existant
  const needsSpaceBefore = before.length && !/\s$/.test(before);
  const needsSpaceAfter = after.length && !/^\s/.test(after);
  const insertion = (needsSpaceBefore ? ' ' : '') + stamp + (needsSpaceAfter ? ' ' : '');

  area.value = before + insertion + after;
  const caret = before.length + insertion.length;
  area.focus();
  area.setSelectionRange(caret, caret);

  onEdit('raw');
  flash('rawCol');
}

function copyTextToClipboard(text){
  // Tente d'abord l'API Clipboard moderne (nécessite un contexte sécurisé :
  // https, localhost… mais souvent PAS un fichier ouvert en file:// selon le navigateur).
  if(navigator.clipboard?.writeText){
    return navigator.clipboard.writeText(text).catch(()=> legacyCopy(text));
  }
  return legacyCopy(text);
}

function legacyCopy(text){
  // Repli fiable pour les fichiers ouverts en local (file://) : marche même
  // quand l'API Clipboard est bloquée (ex: Firefox hors contexte sécurisé).
  return new Promise((resolve, reject)=>{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.left = '-1000px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try{
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('execCommand a échoué'));
    }catch(err){
      document.body.removeChild(ta);
      reject(err);
    }
  });
}

function copyRawToClipboard(){
  const val = document.getElementById('rawArea').value;
  copyTextToClipboard(val)
    .then(()=>flash('rawCol'))
    .catch(()=>alert('❌ La copie a échoué. Sélectionnez le texte manuellement (Ctrl+A puis Ctrl+C) dans la zone de texte.'));
}
function copyIAToClipboard(){
  const val = document.getElementById('iaArea').value;
  copyTextToClipboard(val)
    .then(()=>flash('iaCol'))
    .catch(()=>alert('❌ La copie a échoué. Sélectionnez le texte manuellement (Ctrl+A puis Ctrl+C) dans la zone de texte.'));
}
function copyRawToIA(){
  if(!activeId) return;
  const t = state.tabs[activeId];
  t.ia = t.raw;
  document.getElementById('iaArea').value = t.ia;
  updateCounts();
  persist();
  flash('iaCol');
}
function copyIAToRaw(){
  if(!activeId) return;
  const t = state.tabs[activeId];
  t.raw = t.ia;
  document.getElementById('rawArea').value = t.raw;
  updateCounts();
  persist();
  flash('rawCol');
}
function flash(colId){
  const el = document.getElementById(colId);
  el.style.transition = 'background .15s';
  el.style.background = 'rgba(47,93,98,0.08)';
  setTimeout(()=>{ el.style.background = ''; }, 220);
}

function exportJSON(){
  const data = { type:'carnet_notes', v:1, exportedAt: Date.now(), state };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'carnet_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}

function importJSON(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const data = JSON.parse(ev.target.result);
      const incoming = data.state || data;
      if(!incoming || !incoming.order || !incoming.tabs) throw new Error('format invalide');
      if(!confirm('Remplacer le carnet actuel par celui du fichier importé ?')){ e.target.value=''; return; }
      state = incoming;
      activeId = state.order[0] || null;
      persist();
      renderTabs();
      renderColumns();
      alert('✅ Carnet importé avec succès !');
    }catch(err){ alert('❌ Fichier invalide : '+err.message); }
    e.target.value = '';
  };
  reader.readAsText(file);
}

// ── LIENS ENTRE ONGLETS ──────────────────────────────────────────────────────
// Syntaxe : [[Nom de l'onglet]]  →  Ctrl+clic (⌘+clic sur Mac) pour y accéder
function findTabIdByName(name){
  const nl = name.trim().toLowerCase();
  return state.order.find(id => (state.tabs[id].name || '').trim().toLowerCase() === nl) || null;
}

function linkNameAt(text, pos){
  const re = /\[\[([^\[\]]+)\]\]/g;
  let m;
  while((m = re.exec(text))){
    if(pos >= m.index && pos <= m.index + m[0].length) return m[1].trim();
  }
  return null;
}

function handleNoteLinkClick(e){
  if(!(e.ctrlKey || e.metaKey)) return;
  const area = e.target;
  const name = linkNameAt(area.value, area.selectionStart);
  if(!name) return;
  const targetId = findTabIdByName(name);
  const colId = area.id === 'iaArea' ? 'iaCol' : 'rawCol';
  if(targetId){
    if(targetId !== activeId) selectTab(targetId);
    flash(colId);
  } else if(confirm(`L'onglet "${name}" n'existe pas encore. Le créer ?`)){
    const id = uid();
    const color = PALETTE[state.order.length % PALETTE.length];
    state.tabs[id] = { name, color, raw:'', ia:'' };
    state.order.push(id);
    activeId = id;
    persist();
    renderTabs();
    renderColumns();
  }
}
document.getElementById('rawArea').addEventListener('click', handleNoteLinkClick);
document.getElementById('iaArea').addEventListener('click', handleNoteLinkClick);

// INIT
load();
if(!activeId) activeId = state.order[0] || null;
renderTabs();
renderColumns();
renderTagsBar();
</script>
